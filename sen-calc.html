<title>Máy Tính Sen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Math&display=swap">
<style>
/* layout: one centered device that fills the phone screen; LCD on top, three key blocks below */
:root {
  --page: #e4e7ec;
  --page-ink: #283040;
  --font-key: 'Barlow', 'Barlow Semi Condensed', 'Segoe UI', system-ui, sans-serif;
  --font-lcd: 'Noto Sans', 'Noto Sans Math', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
  --font-brand: 'Barlow', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #0d1117; --page-ink: #c9d1dd; color-scheme: dark; }
}
:root[data-theme="dark"] { --page: #0d1117; --page-ink: #c9d1dd; color-scheme: dark; }
html { box-sizing: border-box; height: 100%; }
body { height: 100%; }
body { background: var(--page); color: var(--page-ink); margin: 0; overscroll-behavior: none; }
.wrap { height: 100%; display: flex; justify-content: center; align-items: center; gap: 28px; padding-inline: 16px; padding-block: 8px; box-sizing: border-box; }
/* the device is laid out at phone size and scaled up as a whole on tablets / desktops (see UI.layout) */
.devbox { position: relative; flex: 0 0 auto; width: min(100%, 430px); height: min(100%, 920px); }

/* ---------- device body ---------- */
.dev {
  --body1: #26344f; --body2: #18223a; --rim: rgba(255,255,255,.07);
  --lab: #a7b3cb; --sh: #5fdcc9; --brand: #e8edf6; --brand2: #8d9ab3;
  --ks-bg: #34435f; --ks-bg2: #2b3850; --ks-fg: #eaf0f8;
  --kfn-bg: #dfe5ee; --kfn-fg: #172136;
  --knum-bg: #f8f5ef; --knum-fg: #121a29;
  --kop-bg: #e9edf3; --kop-fg: #172136;
  --kred-bg: #e2604a; --kred-fg: #fff;
  --kexe-bg: #1eae9b; --kexe-fg: #fff;
  --kshift-bg: #33c4b0; --kshift-fg: #0b2d2a;
  --kd-bg: #3d4d6c; --kd-fg: #eef3fa; --pad: #1d283f;
  --al: #ff9fb3; --kalpha-bg: #d4627b; --kalpha-fg: #fff;
  --bezel: #0e1424; --lcd-bg: #c6cfbd; --lcd-bg2: #b9c3b0; --lcd-ink: 28, 36, 31; --lcd-ink-a: .86;
  position: relative;
  width: 100%; height: 100%; transform-origin: 0 0;
  display: flex; flex-direction: column;
  box-sizing: border-box; padding: 12px 13px 14px;
  border-radius: 28px;
  background: linear-gradient(172deg, var(--body1), var(--body2));
  box-shadow: inset 0 1px 0 var(--rim), inset 0 -2px 0 rgba(0,0,0,.25), 0 24px 60px rgba(8,12,24,.38), 0 0 0 1px rgba(0,0,0,.22);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
.dev[data-body="porcelain"] {
  --body1: #f4f5f7; --body2: #e1e5ea; --rim: rgba(255,255,255,.9);
  --lab: #5e687a; --sh: #0b8f7f; --brand: #1f2a3d; --brand2: #6b7588;
  --ks-bg: #3a4458; --ks-bg2: #30394b; --ks-fg: #fff;
  --kfn-bg: #ffffff; --kfn-fg: #1b2333; --knum-bg: #ffffff; --knum-fg: #121a29; --kop-bg: #edf0f4;
  --kd-bg: #4a556b; --pad: #c9cfd8; --kshift-bg: #1aa594; --kshift-fg: #fff;
  --al: #c2385b; --kalpha-bg: #c2385b;
}
.dev[data-body="moss"] {
  --body1: #2f4a3e; --body2: #1f342b; --lab: #b1c4b8; --sh: #ffd36e; --brand: #eef4ef; --brand2: #9db4a6;
  --ks-bg: #3c5a4c; --ks-bg2: #314c40; --kd-bg: #476859; --pad: #24392f; --kexe-bg: #d9a32f; --kshift-bg: #ffcb57; --kshift-fg: #2b2410;
  --al: #ffb3a6; --kalpha-bg: #c96a5a;
}
.dev[data-body="peach"] {
  --body1: #f3d3c4; --body2: #e6b9a6; --rim: rgba(255,255,255,.6); --lab: #7a4f43; --sh: #b23a5a; --brand: #3a2620; --brand2: #8a6255;
  --ks-bg: #6b4a42; --ks-bg2: #5b3e37; --kd-bg: #7c574e; --pad: #d9a996; --kexe-bg: #c2416a; --kshift-bg: #c2416a; --kshift-fg: #fff; --kred-bg: #d0533f;
  --al: #1f5f84; --kalpha-bg: #2c6d93;
}
.brand { display: flex; align-items: baseline; gap: 8px; padding: 0 6px 7px; color: var(--brand); }
.brand .logo { font: 700 17px/1 var(--font-brand); letter-spacing: .32em; }
.brand .model { font: 600 11px/1 var(--font-brand); color: var(--brand2); letter-spacing: .08em; }
.brand .tag { font: 500 10px/1 var(--font-brand); color: var(--brand2); letter-spacing: .04em; margin-left: auto; white-space: nowrap; }
.brand .solar { display: flex; gap: 2px; align-self: center; }
.brand .solar i { width: 11px; height: 9px; border-radius: 1.5px; background: linear-gradient(160deg, #3b2f2a, #1a1311); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }

/* ---------- display ---------- */
.bezel { flex: 0 0 auto; height: clamp(150px, 29%, 250px); padding: 9px; border-radius: 14px; background: linear-gradient(180deg, #151c2e, var(--bezel)); box-shadow: inset 0 2px 6px rgba(0,0,0,.6), 0 1px 0 var(--rim); box-sizing: border-box; }
.lcd {
  position: relative; height: 100%; overflow: hidden; border-radius: 6px;
  background: linear-gradient(180deg, var(--lcd-bg), var(--lcd-bg2));
  box-shadow: inset 0 2px 5px rgba(0,0,0,.28), inset 0 0 0 1px rgba(0,0,0,.18);
  color: rgba(var(--lcd-ink), var(--lcd-ink-a));
  font-family: var(--font-lcd); font-size: 20px; line-height: 1.2; cursor: default;
}
.dev.off .lcd { background: linear-gradient(180deg, #9aa392, #8d9785); }
.sb { position: absolute; top: 0; left: 0; right: 0; height: 15px; display: flex; align-items: center; gap: 5px; padding: 0 6px; font: 600 9.5px/1 var(--font-key); letter-spacing: .02em; }
.sb .si { opacity: .9; white-space: nowrap; }
.sb .si:first-child { visibility: hidden; padding: 1px 3px; border-radius: 2px; }
.sb .si.on { visibility: visible; background: rgba(var(--lcd-ink), .9); color: var(--lcd-bg); }
.sb .si.on2 { padding: 1px 3px; border: 1px solid currentColor; border-radius: 2px; }
.sb .si.frm { padding: 1px 3px 0; border: 1px solid currentColor; border-radius: 2px; }
.sb .si small { font-size: 8px; }
.sb .si.tag { padding: 1px 3px; border-radius: 2px; background: rgba(var(--lcd-ink), .14); }
.sb .sp { flex: 1; }
.sb .si.app { font-weight: 500; opacity: .75; }
.scr { position: absolute; top: 16px; left: 0; right: 0; bottom: 0; padding: 1px 8px 5px; box-sizing: border-box; overflow: hidden; }

/* ---------- math typesetting ---------- */
.mrow { display: inline-block; white-space: nowrap; line-height: 1.2; }
.m-frac { display: inline-block; vertical-align: middle; text-align: center; margin: 0 .07em; line-height: 1.05; }
.m-frac > .fn, .m-frac > .fd { display: block; padding: 0 .1em; }
.m-frac > .fn { border-bottom: .065em solid currentColor; padding-bottom: .06em; }
.m-frac > .fd { padding-top: .1em; }
.m-frac.sm { font-size: .72em; }
.m-frac.d { font-size: .62em; }
.m-sqrt { display: inline-block; position: relative; padding-left: .5em; margin-left: .04em; vertical-align: baseline; }
.m-sqrt .rs { position: absolute; left: 0; top: 0; width: .52em; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.4; overflow: visible; }
.m-sqrt .rad { display: inline-block; border-top: .065em solid currentColor; padding: .08em .08em 0 .06em; line-height: 1.12; }
.m-idx { display: inline-block; font-size: .6em; vertical-align: .75em; margin-right: -.45em; position: relative; z-index: 1; }
.m-sup { display: inline-block; font-size: .7em; vertical-align: .78em; line-height: 1; margin-left: .02em; }
.m-sup .m-sup { vertical-align: .6em; }
.m-sub { display: inline-block; font-size: .66em; vertical-align: -.3em; line-height: 1; }
.m-abs { display: inline-block; border-left: .07em solid currentColor; border-right: .07em solid currentColor; padding: 0 .14em; margin: 0 .05em; line-height: 1.15; }
.m-int { display: inline-flex; align-items: center; vertical-align: middle; }
.m-int .is { font-size: 1.55em; line-height: 1; transform: scaleY(1.1); }
.m-int .lim { display: inline-flex; flex-direction: column; justify-content: space-between; align-self: stretch; font-size: .6em; margin: 0 .2em 0 -.05em; line-height: 1; }
.m-int .lo { margin-top: .5em; }
.dx { margin-left: .12em; }
.m-big { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; margin-right: .06em; }
.m-big .bs { font-size: 1.3em; line-height: 1; }
.m-big .hi, .m-big .lo { font-size: .58em; }
.m-at { display: inline-block; }
.m-over { display: inline-block; border-top: .065em solid currentColor; line-height: 1.1; padding-top: .02em; }
.op { margin: 0 .06em; }
.tk { white-space: nowrap; }
.hx { font-weight: 600; }
.ng { font-size: .8em; vertical-align: .1em; }
.slot { display: inline-block; width: .55em; height: .78em; border: .06em dashed currentColor; vertical-align: -.06em; margin: 0 .05em; border-radius: .07em; opacity: .55; position: relative; }
.slot.on { opacity: 1; }
.cur { display: inline-block; width: 0; position: relative; }
.cur::after { content: ''; position: absolute; left: -.03em; bottom: -.22em; width: .09em; height: 1.08em; background: currentColor; animation: blink 1.05s steps(1) infinite; }
.slot .cur { position: absolute; left: .12em; bottom: .02em; }
.slot .cur::after { bottom: 0; height: .62em; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cur::after { animation: none; } }

/* ---------- calculation screen ---------- */
.calc { height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
.inp { overflow: hidden; white-space: nowrap; padding: 3px 2px 2px; font-size: 21px; min-height: 30px; }
.inp .inpi { display: inline-block; padding-right: 14px; }
.inp.ro { opacity: .92; }
.out { text-align: right; white-space: nowrap; overflow: hidden; font-size: 25px; padding: 0 2px 2px; }
.out .multi, .multi { display: flex; flex-direction: column; align-items: flex-end; font-size: .82em; gap: 1px; }
.lb { font-size: .78em; margin-right: .25em; opacity: .9; }
.bool { font-weight: 600; letter-spacing: .06em; }
.calc.hist .inp, .calc.hist .out { background: rgba(var(--lcd-ink), .07); }
.hint { font-size: 11.5px; line-height: 1.3; opacity: .8; padding: 2px 2px 0; white-space: normal; }
.hint.big { font-size: 14px; padding-top: 30px; text-align: center; }

/* ---------- menus ---------- */
.menu { height: 100%; position: relative; display: flex; flex-direction: column; }
.mt, .gt { font: 600 12.5px/1.25 var(--font-lcd); padding: 1px 3px 2px; border-bottom: 1px solid rgba(var(--lcd-ink), .5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; }
.ml { flex: 1; display: grid; grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); padding-top: 2px; padding-right: 6px; min-height: 0; }
.mi { display: flex; align-items: center; gap: 7px; padding: 0 6px; font-size: 16.5px; white-space: nowrap; overflow: hidden; border-radius: 3px; min-height: 0; }
.mi.sel { background: rgba(var(--lcd-ink), .88); color: var(--lcd-bg); }
.mi.dis { opacity: .45; }
.mi small { font-size: 11px; opacity: .85; }
.ml1 { overflow: hidden; text-overflow: ellipsis; }
.mr { margin-left: auto; font-size: 13px; opacity: .85; padding-left: 8px; }
.ma { margin-left: 4px; opacity: .7; }
.mr + .ma { margin-left: 4px; }
.rd { width: 10px; height: 10px; border: 1.6px solid currentColor; border-radius: 50%; flex: 0 0 auto; box-sizing: border-box; position: relative; }
.rd.on::after { content: ''; position: absolute; inset: 1.5px; border-radius: 50%; background: currentColor; }
.sbar { position: absolute; right: 0; top: 20px; bottom: 3px; width: 3px; border-radius: 2px; background: rgba(var(--lcd-ink), .15); }
.sbar i { position: absolute; left: 0; right: 0; border-radius: 2px; background: rgba(var(--lcd-ink), .8); }
.vn { font-weight: 600; min-width: 1.2em; display: inline-block; }

/* ---------- home ---------- */
.home { height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 2px 7px 1px 0; box-sizing: border-box; }
.hi { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 6px; min-height: 0; padding: 2px; }
.hi.sel { background: rgba(var(--lcd-ink), .88); color: var(--lcd-bg); }
.hic { line-height: 0; }
.aic { width: 42px; height: 30px; font-family: var(--font-lcd); }
.hl { font-size: 12.5px; white-space: nowrap; letter-spacing: -.01em; }

/* ---------- error / confirm / info ---------- */
.err, .cfm { height: 100%; display: flex; align-items: center; justify-content: center; }
.eb { border: 1.5px solid currentColor; border-radius: 6px; padding: 8px 14px; text-align: center; background: rgba(255,255,255,.12); min-width: 62%; }
.et { font-size: 19px; font-weight: 600; }
.ee { font-size: 11px; opacity: .8; margin-bottom: 4px; }
.ex { font-size: 11.5px; line-height: 1.3; margin: 0 0 6px; max-width: 30em; text-wrap: pretty; }
.eb { max-width: 92%; box-sizing: border-box; }
.eh, .cb { display: flex; gap: 14px; justify-content: center; font-size: 12px; }
.eh b, .cb b { border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; font-size: 10.5px; }
.cfm { flex-direction: column; gap: 10px; text-align: center; }
.ct { font-size: 17px; padding: 0 6px; }
.ctr { font-size: 18px; letter-spacing: 2px; }
.info { height: 100%; display: flex; flex-direction: column; }
.ib { flex: 1; overflow: hidden; font-size: 14px; padding: 2px 3px; }
.help p { margin: 2px 0 6px; font-size: 12.5px; }
.hrow { display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px dotted rgba(var(--lcd-ink), .35); padding: 1px 0; }
.hk { opacity: .8; }

/* ---------- prompts, forms, grids ---------- */
.prompt, .fdef { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.lab { font-size: 17px; }
.pcur { text-align: right; font-size: 22px; }
.ged { height: 100%; display: flex; flex-direction: column; }
.gw { flex: 1; overflow: hidden; min-height: 0; }
table.grid { border-collapse: collapse; font-size: 14px; }
table.grid td { padding: 1px 5px; text-align: right; white-space: nowrap; }
table.grid.ed { width: 100%; table-layout: fixed; }
table.grid.ed td { border: 1px solid rgba(var(--lcd-ink), .35); height: 21px; overflow: hidden; text-overflow: clip; }
table.grid td.cellsel { background: rgba(var(--lcd-ink), .85); color: var(--lcd-bg); }
table.grid th { font-weight: 600; font-size: 12px; padding: 0 4px; border: 1px solid rgba(var(--lcd-ink), .35); background: rgba(var(--lcd-ink), .1); }
.gbot { border-top: 1px solid rgba(var(--lcd-ink), .45); min-height: 30px; font-size: 19px; text-align: right; white-space: nowrap; overflow: hidden; padding-top: 1px; }
.gbot .inp { text-align: left; font-size: 19px; padding-top: 1px; }
.gbot.ro { opacity: .95; }
.gbot.named { display: flex; align-items: center; gap: 6px; }
.gbot.named .gn { flex: 0 0 auto; font-size: 16px; margin-right: auto; padding-left: 2px; }
.gbot.named .inp { flex: 1; min-width: 0; }
.gbot .vd { font-size: 13px; font-weight: 600; margin-left: 8px; padding: 0 5px; border-radius: 3px; }
.gbot .vd.ok { background: rgba(var(--lcd-ink), .85); color: var(--lcd-bg); }
.gbot .vd.no { border: 1px solid currentColor; }
.matw { display: inline-flex; align-items: stretch; vertical-align: middle; font-size: .72em; }
.matw .br { width: 5px; border: 1.5px solid currentColor; }
.matw .br.l { border-right: 0; }
.matw .br.r { border-left: 0; }
table.grid.mat td { padding: 1px 6px; text-align: center; }
.flist { display: flex; flex-direction: column; gap: 1px; }
.fr { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 5px; border-radius: 3px; min-height: 25px; font-size: 17px; }
.fr.sel { background: rgba(var(--lcd-ink), .14); outline: 1.5px solid rgba(var(--lcd-ink), .8); }
.fr .fl { white-space: nowrap; }
.fr .fv { text-align: right; overflow: hidden; white-space: nowrap; max-width: 70%; }
.fr .fv .inp { padding: 0; min-height: 0; font-size: 17px; }
.ratio, .dist { height: 100%; display: flex; flex-direction: column; gap: 2px; }
.out.big { font-size: 26px; margin-top: auto; }
.list { font-size: 17px; }
.lrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 5px; min-height: 25px; border-radius: 3px; white-space: nowrap; }
.lrow.sel { background: rgba(var(--lcd-ink), .88); color: var(--lcd-bg); }
.lrow .lv { overflow: hidden; text-align: right; }

/* periodic table */
.ptab { height: 100%; display: grid; grid-template-columns: 1fr auto; grid-template-rows: 1fr auto; gap: 2px 8px; }
.pgrid { display: grid; grid-template-columns: repeat(18, 1fr); grid-template-rows: repeat(7, 1fr) 4px repeat(2, 1fr); gap: 1.5px; align-self: center; }
.pgrid i { display: block; aspect-ratio: 1; background: rgba(var(--lcd-ink), .25); border-radius: 1px; }
.pgrid i.f { background: rgba(var(--lcd-ink), .17); }
.pgrid i.on { background: rgba(var(--lcd-ink), .95); outline: 1.5px solid rgba(var(--lcd-ink), 1); }
.pinfo { text-align: center; min-width: 74px; align-self: center; }
.psym { font-size: 30px; font-weight: 600; line-height: 1.05; }
.pz, .pw { font-size: 13px; }
.pn { font-size: 11px; }
.ptab .hint { grid-column: 1 / -1; padding-top: 0; }

/* ---------- keyboard ---------- */
.kb { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 10px; }
.kt, .kf, .kn { display: grid; min-height: 0; }
.kt { flex: 3.15; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(3, 1fr); column-gap: 7px; row-gap: 2px; position: relative; }
.kf { flex: 2.15; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(2, 1fr); column-gap: 7px; row-gap: 3px; }
.kn { flex: 4.6; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr); column-gap: 9px; row-gap: 4px; }
.kc { display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; min-width: 0; position: relative; }
.sl { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 13px; font: 600 10.5px/13px var(--font-key); text-align: center; white-space: nowrap; letter-spacing: .01em; overflow: visible; }
.sl.two { justify-content: space-between; padding: 0 2px; }
.sl b { font-weight: 600; transition: opacity .08s, filter .08s; }
.sl b.s { color: var(--sh); }
.sl b.a { color: var(--al); font-weight: 700; }
.sl sup { font-size: .7em; line-height: 0; }
.sl.nm { color: var(--lab); font-size: 8.5px; letter-spacing: .08em; font-weight: 600; }
.kt .sl b { font-size: 9px; letter-spacing: .04em; }
.kt .kd + .sl, .kt .sl b.s { opacity: .95; }
.dev.shift .sl b.s, .dev.alpha .sl b.a { filter: brightness(1.18); }
.dev.shift .sl b.a, .dev.alpha .sl b.s { opacity: .35; }
.dev.basen .sl b.a.hx { color: #ffe08a; }
.k {
  flex: 1; min-height: 0; width: 100%; border: 0; margin: 0; padding: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center; position: relative;
  font: 600 17px/1 var(--font-key); border-radius: 12px; -webkit-tap-highlight-color: transparent;
  box-shadow: 0 2px 0 rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.08);
  transition: transform .05s, box-shadow .05s, filter .05s;
}
.k::before { content: ''; position: absolute; inset: -12px -3px -3px; }
.k:focus { outline: none; }
.k:focus-visible { outline: 2px solid var(--sh); outline-offset: 2px; }
.k.dn { transform: translateY(1.5px); box-shadow: 0 .5px 0 rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.25); filter: brightness(.93); }
.k .ic { width: 20px; height: 20px; }
.k .ic.sm { width: 17px; height: 17px; }
.ks { background: linear-gradient(180deg, var(--ks-bg), var(--ks-bg2)); color: var(--ks-fg); border-radius: 999px; box-shadow: 0 2px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12); }
.kt .kc { padding: 0 8%; }
.kt .kc .k { max-height: 40px; }
.kshift { background: var(--kshift-bg); color: var(--kshift-fg); border-radius: 999px; box-shadow: 0 2px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35); }
.dev.shift .kshift { box-shadow: 0 0 0 2px var(--body2), 0 0 0 4px var(--sh); }

<script>

/* ===== num ===== */
/* num.js — exact & floating arithmetic for the calculator
 * Num: { v: float, ex: null | {s: terms} | {p: Q} }
 *   terms: sorted [{k: BigInt squarefree >= 1, c: Q}]  (value = Σ c·√k)
 *   p: Q (value = p·π)
 */
(function (C) {
  'use strict';

  class CalcError extends Error {
    constructor(code, pos) { super(code); this.code = code; this.pos = pos || null; }
  }
  const err = (code, pos) => new CalcError(code, pos);
  const MATH = () => err('MATH');

  /* ---------- BigInt helpers ---------- */
  const babs = (a) => (a < 0n ? -a : a);
  function bgcd(a, b) { a = babs(a); b = babs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
  const BIGLIM = 10n ** 72n;
  const KLIM = 10n ** 15n;

  function isqrt(n) { // floor sqrt of BigInt n >= 0
    if (n < 0n) throw MATH();
    if (n < 2n) return n;
    if (n < 9007199254740992n) {
      let r = BigInt(Math.floor(Math.sqrt(Number(n))));
      while (r * r > n) r--; while ((r + 1n) * (r + 1n) <= n) r++;
      return r;
    }
    let x = BigInt('1' + '0'.repeat(Math.ceil(n.toString().length / 2)));
    for (;;) { const y = (x + n / x) >> 1n; if (y >= x) break; x = y; }
    while (x * x > n) x--; while ((x + 1n) * (x + 1n) <= n) x++;
    return x;
  }
  function iroot(n, q) { // exact q-th root of BigInt n>=0, or null
    if (n < 0n) return null;
    if (n < 2n) return n;
    const qn = Number(q);
    if (qn > 200) return null;
    let r = BigInt(Math.round(Math.pow(Number(n), 1 / qn)));
    for (let d = -2n; d <= 2n; d++) { const c = r + d; if (c >= 0n && c ** q === n) return c; }
    if (n > 10n ** 30n) { // refine with binary search
      let lo = 0n, hi = 1n; while (hi ** q <= n) hi <<= 1n;
      while (lo < hi) { const mid = (lo + hi + 1n) >> 1n; if (mid ** q <= n) lo = mid; else hi = mid - 1n; }
      return lo ** q === n ? lo : null;
    }
    return null;
  }
  // m = s^2 * k with k squarefree
  function sqfree(m) {
    if (m <= 0n) return [0n, 1n];
    if (m < 9007199254740992n) {
      let n = Number(m), s = 1, k = 1;
      const lim = Math.min(Math.floor(Math.sqrt(n)), 2000000);
      let p = 2;
      while (p <= lim && p * p <= n) {
        if (n % p === 0) {
          let e = 0; while (n % p === 0) { n /= p; e++; }
          if (e >= 2) s *= Math.pow(p, e >> 1);
          if (e & 1) k *= p;
        }
        p = p === 2 ? 3 : p + 2;
      }
      // n remaining: 1, prime, or product of large primes (> lim)
      if (n > 1) {
        const r = Math.round(Math.sqrt(n));
        if (r * r === n && n > lim * lim) s *= r; else k *= n;
      }
      return [BigInt(s), BigInt(k)];
    }
    let n = m, s = 1n, k = 1n;
    for (let p = 2n; p < 20000n; p = p === 2n ? 3n : p + 2n) {
      if (n % p === 0n) {
        let e = 0; while (n % p === 0n) { n /= p; e++; }
        if (e >= 2) s *= p ** BigInt(e >> 1);
        if (e & 1) k *= p;
      }
    }
    if (n > 1n) { const r = isqrt(n); if (r * r === n) s *= r; else k *= n; }

  }

  /* ---------- Rationals ---------- */
  function Q(n, d) {
    if (typeof n === 'number') n = BigInt(n);
    if (d === undefined) d = 1n; else if (typeof d === 'number') d = BigInt(d);
    if (d === 0n) throw MATH();
    if (d < 0n) { n = -n; d = -d; }
    const g = bgcd(n, d);
    if (g > 1n) { n /= g; d /= g; }
    return { n, d };
  }

  const qsub = (a, b) => (a.d === b.d ? Q(a.n - b.n, a.d) : Q(a.n * b.d - b.n * a.d, a.d * b.d));

    return null;
  }
  function digitsOf(b) { return babs(b).toString().length; }

  /* ---------- Num ---------- */
  class Num {
    constructor(v, ex) { this.v = v; this.ex = ex || null; }
  }
  const MAXTERMS = 4;
  function sNorm(terms) {
    const m = new Map();
    for (const t of terms) {
      const key = t.k.toString(); const prev = m.get(key);
      m.set(key, prev ? { k: t.k, c: qadd(prev.c, t.c) } : t);

  // loses every digit, so the sum is redone in BigInt fixed point with enough guard digits.
  function surdF(terms) {

    for (const t of terms) { const x = qtoF(t.c) * (t.k === 1n ? 1 : Math.sqrt(Number(t.k))); s += x; m += Math.abs(x); }
    if (terms.length < 2 || !isFinite(m) || Math.abs(s) >= m * 1e-3) return s;

      let acc = 0n;
      for (const t of terms) acc += (t.c.n * (t.k === 1n ? S : isqrt(t.k * S * S))) / t.c.d;
      if (acc === 0n) { if (P >= 400) return 0; continue; }
      if (babs(acc) >= errUnits * 10n ** 17n) return parseFloat(acc.toString() + 'e-' + P);
    }
    return fallback;

  // results (fractions, surds, π multiples) are checked too: 15⁹⁰ used to show 7.05×10¹⁰⁵ and 10¹⁰⁰ 1×10¹⁰⁰.

    return new Num(v, { s: q.n === 0n ? [] : [{ k: 1n, c: q }] });
  }
  function fromSurd(terms) {

    const v = surdF(terms);
    if (tooBig(v)) throw MATH();
    if (tooSmall(v)) return ZERO;
    if (terms.length > MAXTERMS || terms.some((t) => qbig(t.c) || t.k > KLIM)) return new Num(v, null);
    return new Num(v, { s: terms });
  }
  function fromPi(c) {

  function fitBox(el, hOnly) {
    el.style.transform = '';
    const p = el.parentElement; if (!p) return;
    const cs = getComputedStyle(p);
    const aw = p.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), ah = p.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const r = { width: el.offsetWidth, height: el.offsetHeight };
    if (!aw || !ah || !r.width || !r.height) return;
    const s = hOnly ? Math.min(1, ah / r.height) : Math.min(1, aw / r.width, ah / r.height);
    if (s < 0.999) el.style.transform = 'scale(' + Math.max(0.3, s).toFixed(3) + ')';
  }
  function fitText(el) {
    el.style.fontSize = '';
    const max = el.clientWidth; if (!max) return;
    let fs = parseFloat(getComputedStyle(el).fontSize);
    let guard = 0;
    while (el.scrollWidth > max + 1 && fs > 10 && guard++ < 20) { fs -= 1; el.style.fontSize = fs + 'px'; }
  }

  /* ---------- home screen ---------- */
  class Home extends Screen {
    constructor(ui) { super(ui); this.sel = ui.S.lastApp || 0; this.top = 0; }
    key(k) {
      const n = APPS.length;
      switch (k) {
        case 'LEFT': this.sel = (this.sel - 1 + n) % n; return true;
        case 'RIGHT': this.sel = (this.sel + 1) % n; return true;
        case 'UP': this.sel = this.sel - 3 >= 0 ? this.sel - 3 : this.sel; return true;
        case 'DOWN': this.sel = Math.min(n - 1, this.sel + 3); return true;
        case 'PGUP': this.sel = Math.max(0, this.sel - 6); return true;
        case 'PGDN': this.sel = Math.min(n - 1, this.sel + 6); return true;
        case 'OK': case 'EXE': this.ui.openApp(this.sel); return true;
        case 'AC': case 'BACK': return true;
        default: return /^D\d$/.test(k) || k.startsWith('S_') || C.EDIT_KEYS.has(k);
      }
    }
    tap(el) {
      const it = el.closest('[data-app]'); if (!it) return false;
      const i = +it.getAttribute('data-app');
      if (i === this.sel) this.ui.openApp(i); else this.sel = i;
      return true;
    }
    render() {
      const row = Math.floor(this.sel / 3);
      if (row < this.top) this.top = row; if (row > this.top + 1) this.top = row - 1;
      let h = '<div class="home">';
      for (let i = this.top * 3; i < Math.min(APPS.length, this.top * 3 + 6); i++) {
        const a = APPS[i];
        h += '<div class="hi' + (i === this.sel ? ' sel' : '') + '" data-app="' + i + '"><div class="hic">' + a.icon + '</div><div class="hl">' + a.name + '</div></div>';
      }
      h += '</div>';
      const rows = Math.ceil(APPS.length / 3);
      if (rows > 2) h += '<div class="sbar"><i style="top:' + (this.top / rows * 100) + '%;height:' + (2 / rows * 100) + '%"></i></div>';
      return h;
    }
  }

      if (this.res) { const v = this.res.value; return v && v.multi ? v.main : v; }
      return null;
    }
    onStored(name) { this.storedMsg = name; }
    /* ----- menus ----- */
    formatMenu() {
      const v = this.res.value; const ui = this.ui; const items = [];
      const set = (view) => () => { this.view = view; ui.pop(); };
      const cur = this.view;
      if (this.mode === 'base' && v instanceof C.Num) {
        for (const [b, name] of BASES) items.push({ label: name, checked: (cur && cur.base) === b, act: set({ base: b }) });
        return new Menu(ui, 'FORMAT', items);
      }
      if (C.isCx(v)) {
        items.push({ label: 'a+bi', checked: cur === 'rect', act: set('rect') }, { label: 'r∠θ', checked: cur === 'polar', act: set('polar') }, { label: 'Thập phân', checked: cur === 'dec', act: set('dec') });
        return new Menu(ui, 'FORMAT', items);
      }
      if (!(v instanceof C.Num)) { items.push({ label: 'Chuẩn', checked: true, act: set('std') }); return new Menu(ui, 'FORMAT', items); }
      const st = ui.st;
      const ex = v.ex ? v : C.recognize(v, 'L'); const r = ex && C.ratOf(ex);
      items.push({ label: 'Chuẩn', checked: cur === 'std', act: set('std') });
      items.push({ label: 'Thập phân', checked: cur === 'dec', act: set('dec') });
      if (r && r.d !== 1n && C.digitsOf(r.n) + C.digitsOf(r.d) <= 10) {
        items.push({ label: 'Phân số a/b', checked: cur === 'imp', act: set('imp') });
        if (C.babs(r.n) > r.d) items.push({ label: 'Hỗn số', checked: cur === 'mix', act: set('mix') });
      }
      items.push({ label: 'Kỹ thuật (ENG)', checked: cur === 'eng', act: set('eng') });
      items.push({ label: 'Độ phút giây', checked: cur === 'dms', act: set('dms') });
      if (r && r.d === 1n && r.n >= 2n && r.n < 10n ** 10n) items.push({ label: 'Thừa số nguyên tố', checked: cur === 'prime', act: set('prime') });
      if (r && r.d !== 1n && C.recurRow(r, st)) items.push({ label: 'Số thập phân tuần hoàn', checked: cur === 'recur', act: set('recur') });
      return new Menu(ui, 'FORMAT', items);
    }
    tools() {
      const ui = this.ui; const items = [];
      items.push({ label: 'Hoàn tác', act: () => { ui.pop(); if (this.state !== 'edit') this.editRow(this.res.row); this.ed.popUndo(); } });
      if (this.opt.app === 'calc' || this.opt.app === 'cplx') items.push({ label: 'Kiểm tra (Verify)', right: this.verify ? 'Bật' : 'Tắt', act: () => { this.verify = !this.verify; ui.pop(); this.startNew(); } });
      items.push({ label: 'CALC (thay giá trị biến)', act: () => { ui.pop(); this.startCalc(); } });
      if (this.opt.tools) for (const it of this.opt.tools(this)) items.push(it);
      items.push({ label: 'Xóa lịch sử', act: () => { ui.push(new Confirm(ui, 'Xóa lịch sử tính toán?', () => { this.hist.length = 0; ui.popTo(this); this.startNew(); })); } });
      return items;
    }
    varMenu() { return this.opt.varMenu ? this.opt.varMenu(this) : null; }
    render() {
      const mode = this.ui.st.io[0] === 'L' ? 'L' : 'M';
      let h = '<div class="calc' + (this.state === 'hist' ? ' hist' : '') + '">';

        if (this.ed.isEmpty() && this.verify) h += '<div class="hint">Nhập đẳng thức/bất đẳng thức (=, ≠, <, >, ≤, ≥ trong CATALOG ▸ Khác; SHIFT x là =)</div>';
      } else {
        const e = this.res;
        h += '<div class="inp ro"><div class="inpi fit2h">' + renderRow(e.row, { mode }) + '</div></div>';
        if (e.solve) {

            '<div class="lr"><span class="lb">L−R=</span>' + C.renderOut(C.fmtReal(e.solve.lr, this.ui.st, 'dec')) + '</div></div></div>';
        } else h += '<div class="out"><div class="oc fit2">' + valueHTML(e.value, this.ui, this.view, e.flags, e.mode || this.mode) + '</div></div>';
      }
      return h + '</div>';
    }
  }

  // prompt one variable value (CALC)
  class VarPrompt extends Screen {
    constructor(ui, name, mode, onNext, onCancel) {

        if (!this.le.ed.isEmpty()) {
          try { const r = C.evaluateRow(this.le.ed.root, this.ui.ctx(this.mode)); this.ui.S.vars[this.name] = r.value.multi ? r.value.main : r.value; }
          catch (e) { if (e instanceof C.CalcError) { this.ui.push(new ErrScreen(this.ui, e.code)); return true; } throw e; }
        }
        this.ui.pop(); this.onNext(); return true;
      }
      if (k === 'AC') { if (!this.le.ed.isEmpty()) { this.le.ed.clear(); return true; } this.ui.pop(); this.onCancel(); return true; }

  /* ---------- matrix & vector editors ---------- */
  class DimPick extends Menu {}
  class GridEditor extends Screen {
    // generic numeric grid editor: get(r,c) / set(r,c,v)
    constructor(ui, title, rows, cols, get, set, onDone, opt) {
      super(ui); this.title = title; this.R = rows; this.Cc = cols; this.get = get; this.set = set; this.onDone = onDone; this.opt = opt || {};
      this.r = 0; this.c = 0; this.le = null;
    }
    target() { if (!this.le) this.le = new C.LineEdit({ mode: 'real' }); return this.le.ed; }
    key(k) {
      if (this.le) {
        if (k === 'EXE' || k === 'OK') { this.commit(); return true; }
        if (k === 'AC') { this.le = null; return true; }
        if ((k === 'UP' || k === 'DOWN') && !this.le.ed.vert(k === 'UP' ? 'up' : 'down')) { this.le = null; return this.key(k); }
        return this.le.key(k);
      }
      switch (k) {
        case 'UP': this.r = (this.r - 1 + this.R) % this.R; return true;
        case 'DOWN': this.r = (this.r + 1) % this.R; return true;
        case 'LEFT': this.c = (this.c - 1 + this.Cc) % this.Cc; return true;
        case 'RIGHT': this.c = (this.c + 1) % this.Cc; return true;
        case 'AC': case 'BACK': case 'EXE': this.ui.pop(); if (this.onDone) this.onDone(); return true;
        case 'OK': this.le = new C.LineEdit({ mode: 'real' }); return true;
        case 'DEL': this.set(this.r, this.c, C.ZERO); return true;
        default:
          if (C.EDIT_KEYS.has(k)) { this.le = new C.LineEdit({ mode: 'real' }); return this.le.key(k); }
          return false;
      }
    }
    commit() {
      const ed = this.le.ed;
      if (!ed.isEmpty()) {
        try {
          const r = C.evaluateRow(ed.root, this.ui.ctx('real'));
          const v = C.realOf(r.value.multi ? r.value.main : r.value);
          this.set(this.r, this.c, v);
        } catch (e) { if (e instanceof C.CalcError) { this.ui.push(new ErrScreen(this.ui, e.code)); return; } throw e; }
      }
      this.le = null;
      // advance
      if (this.c < this.Cc - 1) this.c++; else if (this.r < this.R - 1) { this.r++; this.c = 0; }
    }
    tap(el) { const td = el.closest('[data-rc]'); if (!td) return false; const [r, c] = td.getAttribute('data-rc').split(',').map(Number); if (r === this.r && c === this.c) this.le = new C.LineEdit({ mode: 'real' }); else { this.r = r; this.c = c; this.le = null; } return true; }
    render() {
      const st = this.ui.st;
      let h = '<div class="ged"><div class="gt">' + this.title + '</div><div class="gw"><table class="grid ed">';
      for (let i = 0; i < this.R; i++) {
        h += '<tr>';
        for (let j = 0; j < this.Cc; j++) h += '<td data-rc="' + i + ',' + j + '" class="' + (i === this.r && j === this.c ? 'cellsel' : '') + '">' + C.cellText(this.get(i, j), st, 7) + '</td>';
        h += '</tr>';
      }
      h += '</table></div>';
      const mode = st.io[0] === 'L' ? 'L' : 'M';
      if (this.le) h += '<div class="gbot">' + this.le.html(mode) + '</div>';
      else h += '<div class="gbot ro">' + (this.opt.cellName ? this.opt.cellName(this.r, this.c) + ' = ' : '') + C.renderOut(C.fmtReal(this.get(this.r, this.c), st)) + '</div>';
      return h + '</div>';
    }
  }
  function defineMat(ui, name, after) {
    const pickR = new Menu(ui, 'Mat' + name + ': số hàng', [1, 2, 3, 4].map((r) => ({ label: r + ' hàng', act: () => {
      ui.push(new Menu(ui, 'Mat' + name + ': số cột', [1, 2, 3, 4].map((c) => ({ label: c + ' cột', act: () => {
        ui.S.mats[name] = C.mzero(r, c);
        ui.pop(); ui.pop();
        editMat(ui, name, after);
      } })), { sel: 0 }));
    } })), { sel: 1 });
    ui.push(pickR);
  }
  function editMat(ui, name, after) {
    const m = ui.S.mats[name]; if (!m) { defineMat(ui, name, after); return; }
    ui.push(new GridEditor(ui, 'Mat' + name + ' (' + m.r + '×' + m.c + ')', m.r, m.c, (r, c) => ui.S.mats[name].a[r][c], (r, c, v) => { ui.S.mats[name].a[r][c] = v; ui.save(); }, after));
  }
  function defineVec(ui, name, after) {
    ui.push(new Menu(ui, 'Vct' + name + ': số chiều', [2, 3].map((n) => ({ label: n + ' chiều', act: () => {
      ui.S.vecs[name] = new C.Vec(Array.from({ length: n }, () => C.ZERO)); ui.pop(); editVec(ui, name, after);
    } })), { sel: 1 }));
  }
  function editVec(ui, name, after) {
    const v = ui.S.vecs[name]; if (!v) { defineVec(ui, name, after); return; }
    ui.push(new GridEditor(ui, 'Vct' + name + ' (' + v.n + ' chiều)', 1, v.n, (r, c) => ui.S.vecs[name].a[c], (r, c, x) => { ui.S.vecs[name].a[c] = x; ui.save(); }, after));
  }
  function matListMenu(ui, scr, kind) {
    const isM = kind === 'mat';
    const store = isM ? ui.S.mats : ui.S.vecs;
    const names = ['A', 'B', 'C', 'D', 'Ans'];

        if (n !== 'Ans') {
          items.push({ label: 'Sửa', act: () => { ui.popTo(scr); (isM ? editMat : editVec)(ui, n); } });

        } else if (v) items.push({ label: 'Xem', act: () => { ui.popTo(scr); ui.push(new C.Info(ui, pre + 'Ans', C.valueHTML(v, ui))); } });

  /* ---------- ratio ---------- */
  class RatioScreen extends Screen {
    constructor(ui) { super(ui); this.type = null; this.vals = [null, null, null]; this.sel = 0; this.le = null; this.res = null; }
    start() {
      return new Menu(this.ui, 'Tỉ lệ', [
        { label: 'A : B = X : D', act: () => { this.type = 'X'; this.ui.pop(); } },
        { label: 'A : B = C : X', act: () => { this.type = 'C'; this.ui.pop(); } },
      ]);
    }
    names() { return this.type === 'X' ? ['A', 'B', 'D'] : ['A', 'B', 'C']; }
    target() { if (!this.le) this.le = new C.LineEdit({ mode: 'real' }); return this.le.ed; }
    key(k) {
      if (!this.type) { if (k === 'BACK') return false; if (k === 'AC') return true; this.ui.push(this.start()); return true; }
      if (this.res) { if (k === 'EXE' || k === 'AC' || k === 'BACK' || k === 'OK') { this.res = null; return true; } return true; }
      if (this.le) {
        if (k === 'EXE' || k === 'OK') { this.commit(); return true; }
        if (k === 'AC') { this.le = null; return true; }
        return this.le.key(k);
      }
      switch (k) {
        case 'UP': this.sel = (this.sel + 2) % 3; return true;
        case 'DOWN': this.sel = (this.sel + 1) % 3; return true;
        case 'EXE': case 'OK': this.solve(); return true;
        case 'TOOLS': return false;
        case 'BACK': return false;
        case 'AC': return true;
        default:
          if (C.EDIT_KEYS.has(k)) { this.le = new C.LineEdit({ mode: 'real' }); return this.le.key(k); }
          return false;
      }
    }
    tools() { return [{ label: 'Chọn dạng tỉ lệ', act: () => { this.ui.pop(); this.ui.push(this.start()); } }]; }
    commit() {
      try {
        if (!this.le.ed.isEmpty()) { const r = C.evaluateRow(this.le.ed.root, this.ui.ctx('real')); this.vals[this.sel] = C.realOf(r.value.multi ? r.value.main : r.value); }
        this.le = null; this.sel = Math.min(2, this.sel + 1);
      } catch (e) { if (e instanceof C.CalcError) this.ui.push(new ErrScreen(this.ui, e.code)); else throw e; }
    }
    solve() {
      const [a, b, c] = this.vals.map((v) => v || C.ZERO);
      try {
        // A:B = X:D -> X = A·D/B ; A:B = C:X -> X = B·C/A
        const x = this.type === 'X' ? C.div(C.mul(a, c), b) : C.div(C.mul(b, c), a);
        if (C.isZero(a) || C.isZero(b)) throw C.err('MATH');
        this.res = x; this.ui.S.ans = x;
      } catch (e) { if (e instanceof C.CalcError) this.ui.push(new ErrScreen(this.ui, e.code)); else throw e; }
    }
    tap(el) { const r = el.closest('[data-i]'); if (!r) return false; const i = +r.getAttribute('data-i'); if (i === this.sel) this.le = new C.LineEdit({ mode: 'real' }); else { this.sel = i; this.le = null; } return true; }
    render() {
      if (!this.type) return '<div class="hint big">Bấm OK để chọn dạng tỉ lệ</div>';
      const st = this.ui.st; const n = this.names();
      const eq = this.type === 'X' ? 'A : B = <b>X</b> : D' : 'A : B = C : <b>X</b>';
      if (this.res) return '<div class="ratio"><div class="gt">' + eq + '</div><div class="out big"><span class="lb">X=</span>' + C.renderOut(C.fmtReal(this.res, st)) + '</div></div>';
      let h = '<div class="ratio"><div class="gt">' + eq + '</div><div class="flist">';
      for (let i = 0; i < 3; i++) {
        h += '<div class="fr' + (i === this.sel ? ' sel' : '') + '" data-i="' + i + '"><span class="fl">' + n[i] + ' =</span><span class="fv">' +
          (i === this.sel && this.le ? this.le.html(st.io[0] === 'L' ? 'L' : 'M') : (this.vals[i] ? C.renderOut(C.fmtReal(this.vals[i], st)) : '0')) + '</span></div>';
      }
      return h + '</div><div class="hint">Nhập A, B, ' + (this.type === 'X' ? 'D' : 'C') + ' rồi bấm <b>EXE</b> để tìm X</div></div>';
    }
  }

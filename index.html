/* layout: one centered device that fills the phone screen; LCD on top, three key blocks below */
:root {
  --page: #e4e7ec;
  --page-ink: #283040;
  --font-key: 'Barlow', 'Barlow Semi Condensed', 'Segoe UI', system-ui, sans-serif;
  --font-lcd: 'Noto Sans', 'Noto Sans Math', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
  --font-brand: 'Barlow', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #0d1117; --page-ink: #c9d1dd; color-scheme: dark; }
}
:root[data-theme="dark"] { --page: #0d1117; --page-ink: #c9d1dd; color-scheme: dark; }
html { box-sizing: border-box; height: 100%; }
body { height: 100%; }
body { background: var(--page); color: var(--page-ink); margin: 0; overscroll-behavior: none; }
.wrap { height: 100%; display: flex; justify-content: center; align-items: center; gap: 28px; padding-inline: 16px; padding-block: 8px; box-sizing: border-box; }
/* the device is laid out at phone size and scaled up as a whole on tablets / desktops (see UI.layout) */
.devbox { position: relative; flex: 0 0 auto; width: min(100%, 430px); height: min(100%, 920px); }

/* ---------- device body ---------- */
.dev {
  --body1: #26344f; --body2: #18223a; --rim: rgba(255,255,255,.07);
  --lab: #a7b3cb; --sh: #5fdcc9; --brand: #e8edf6; --brand2: #8d9ab3;
  --ks-bg: #34435f; --ks-bg2: #2b3850; --ks-fg: #eaf0f8;
  --kfn-bg: #dfe5ee; --kfn-fg: #172136;
  --knum-bg: #f8f5ef; --knum-fg: #121a29;
  --kop-bg: #e9edf3; --kop-fg: #172136;
  --kred-bg: #e2604a; --kred-fg: #fff;
  --kexe-bg: #1eae9b; --kexe-fg: #fff;
  --kshift-bg: #33c4b0; --kshift-fg: #0b2d2a;
  --kd-bg: #3d4d6c; --kd-fg: #eef3fa; --pad: #1d283f;
  --al: #ff9fb3; --kalpha-bg: #d4627b; --kalpha-fg: #fff;
  --bezel: #0e1424; --lcd-bg: #c6cfbd; --lcd-bg2: #b9c3b0; --lcd-ink: 28, 36, 31; --lcd-ink-a: .86;
  position: relative;
  width: 100%; height: 100%; transform-origin: 0 0;
  display: flex; flex-direction: column;
  box-sizing: border-box; padding: 12px 13px 14px;
  border-radius: 28px;
  background: linear-gradient(172deg, var(--body1), var(--body2));
  box-shadow: inset 0 1px 0 var(--rim), inset 0 -2px 0 rgba(0,0,0,.25), 0 24px 60px rgba(8,12,24,.38), 0 0 0 1px rgba(0,0,0,.22);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
.dev[data-body="porcelain"] {
  --body1: #f4f5f7; --body2: #e1e5ea; --rim: rgba(255,255,255,.9);
  --lab: #5e687a; --sh: #0b8f7f; --brand: #1f2a3d; --brand2: #6b7588;
  --ks-bg: #3a4458; --ks-bg2: #30394b; --ks-fg: #fff;
  --kfn-bg: #ffffff; --kfn-fg: #1b2333; --knum-bg: #ffffff; --knum-fg: #121a29; --kop-bg: #edf0f4;
  --kd-bg: #4a556b; --pad: #c9cfd8; --kshift-bg: #1aa594; --kshift-fg: #fff;
  --al: #c2385b; --kalpha-bg: #c2385b;
}
.dev[data-body="moss"] {
  --body1: #2f4a3e; --body2: #1f342b; --lab: #b1c4b8; --sh: #ffd36e; --brand: #eef4ef; --brand2: #9db4a6;
  --ks-bg: #3c5a4c; --ks-bg2: #314c40; --kd-bg: #476859; --pad: #24392f; --kexe-bg: #d9a32f; --kshift-bg: #ffcb57; --kshift-fg: #2b2410;
  --al: #ffb3a6; --kalpha-bg: #c96a5a;
}
.dev[data-body="peach"] {
  --body1: #f3d3c4; --body2: #e6b9a6; --rim: rgba(255,255,255,.6); --lab: #7a4f43; --sh: #b23a5a; --brand: #3a2620; --brand2: #8a6255;
  --ks-bg: #6b4a42; --ks-bg2: #5b3e37; --kd-bg: #7c574e; --pad: #d9a996; --kexe-bg: #c2416a; --kshift-bg: #c2416a; --kshift-fg: #fff; --kred-bg: #d0533f;
  --al: #1f5f84; --kalpha-bg: #2c6d93;
}
.brand { display: flex; align-items: baseline; gap: 8px; padding: 0 6px 7px; color: var(--brand); }
.brand .logo { font: 700 17px/1 var(--font-brand); letter-spacing: .32em; }
.brand .model { font: 600 11px/1 var(--font-brand); color: var(--brand2); letter-spacing: .08em; }
.brand .tag { font: 500 10px/1 var(--font-brand); color: var(--brand2); letter-spacing: .04em; margin-left: auto; white-space: nowrap; }
.brand .solar { display: flex; gap: 2px; align-self: center; }
.brand .solar i { width: 11px; height: 9px; border-radius: 1.5px; background: linear-gradient(160deg, #3b2f2a, #1a1311); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }

/* ---------- display ---------- */
.bezel { flex: 0 0 auto; height: clamp(150px, 29%, 250px); padding: 9px; border-radius: 14px; background: linear-gradient(180deg, #151c2e, var(--bezel)); box-shadow: inset 0 2px 6px rgba(0,0,0,.6), 0 1px 0 var(--rim); box-sizing: border-box; }
.lcd {
  position: relative; height: 100%; overflow: hidden; border-radius: 6px;
  background: linear-gradient(180deg, var(--lcd-bg), var(--lcd-bg2));
  box-shadow: inset 0 2px 5px rgba(0,0,0,.28), inset 0 0 0 1px rgba(0,0,0,.18);
  color: rgba(var(--lcd-ink), var(--lcd-ink-a));
  font-family: var(--font-lcd); font-size: 20px; line-height: 1.2; cursor: default;
}
.dev.off .lcd { background: linear-gradient(180deg, #9aa392, #8d9785); }
.sb { position: absolute; top: 0; left: 0; right: 0; height: 15px; display: flex; align-items: center; gap: 5px; padding: 0 6px; font: 600 9.5px/1 var(--font-key); letter-spacing: .02em; }
.sb .si { opacity: .9; white-space: nowrap; }
.sb .si:first-child { visibility: hidden; padding: 1px 3px; border-radius: 2px; }
.sb .si.on { visibility: visible; background: rgba(var(--lcd-ink), .9); color: var(--lcd-bg); }
.sb .si.on2 { padding: 1px 3px; border: 1px solid currentColor; border-radius: 2px; }
.sb .si.frm { padding: 1px 3px 0; border: 1px solid currentColor; border-radius: 2px; }
.sb .si small { font-size: 8px; }
.sb .si.tag { padding: 1px 3px; border-radius: 2px; background: rgba(var(--lcd-ink), .14); }
.sb .sp { flex: 1; }
.sb .si.app { font-weight: 500; opacity: .75; }
.scr { position: absolute; top: 16px; left: 0; right: 0; bottom: 0; padding: 1px 8px 5px; box-sizing: border-box; overflow: hidden; }

/* ---------- math typesetting ---------- */
.mrow { display: inline-block; white-space: nowrap; line-height: 1.2; }
.m-frac { display: inline-block; vertical-align: middle; text-align: center; margin: 0 .07em; line-height: 1.05; }
.m-frac > .fn, .m-frac > .fd { display: block; padding: 0 .1em; }
.m-frac > .fn { border-bottom: .065em solid currentColor; padding-bottom: .06em; }
.m-frac > .fd { padding-top: .1em; }
.m-frac.sm { font-size: .72em; }
.m-frac.d { font-size: .62em; }
.m-sqrt { display: inline-block; position: relative; padding-left: .5em; margin-left: .04em; vertical-align: baseline; }
.m-sqrt .rs { position: absolute; left: 0; top: 0; width: .52em; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.4; overflow: visible; }
.m-sqrt .rad { display: inline-block; border-top: .065em solid currentColor; padding: .08em .08em 0 .06em; line-height: 1.12; }
.m-idx { display: inline-block; font-size: .6em; vertical-align: .75em; margin-right: -.45em; position: relative; z-index: 1; }
.m-sup { display: inline-block; font-size: .7em; vertical-align: .78em; line-height: 1; margin-left: .02em; }
.m-sup .m-sup { vertical-align: .6em; }
.m-sub { display: inline-block; font-size: .66em; vertical-align: -.3em; line-height: 1; }
.m-abs { display: inline-block; border-left: .07em solid currentColor; border-right: .07em solid currentColor; padding: 0 .14em; margin: 0 .05em; line-height: 1.15; }
.m-int { display: inline-flex; align-items: center; vertical-align: middle; }
.m-int .is { font-size: 1.55em; line-height: 1; transform: scaleY(1.1); }
.m-int .lim { display: inline-flex; flex-direction: column; justify-content: space-between; align-self: stretch; font-size: .6em; margin: 0 .2em 0 -.05em; line-height: 1; }
.m-int .lo { margin-top: .5em; }
.dx { margin-left: .12em; }
.m-big { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; margin-right: .06em; }
.m-big .bs { font-size: 1.3em; line-height: 1; }
.m-big .hi, .m-big .lo { font-size: .58em; }
.m-at { display: inline-block; }
.m-over { display: inline-block; border-top: .065em solid currentColor; line-height: 1.1; padding-top: .02em; }
.op { margin: 0 .06em; }
.tk { white-space: nowrap; }
.hx { font-weight: 600; }
.ng { font-size: .8em; vertical-align: .1em; }
.slot { display: inline-block; width: .55em; height: .78em; border: .06em dashed currentColor; vertical-align: -.06em; margin: 0 .05em; border-radius: .07em; opacity: .55; position: relative; }
.slot.on { opacity: 1; }
.cur { display: inline-block; width: 0; position: relative; }
.cur::after { content: ''; position: absolute; left: -.03em; bottom: -.22em; width: .09em; height: 1.08em; background: currentColor; animation: blink 1.05s steps(1) infinite; }
.slot .cur { position: absolute; left: .12em; bottom: .02em; }
.slot .cur::after { bottom: 0; height: .62em; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cur::after { animation: none; } }

/* ---------- calculation screen ---------- */
.calc { height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
.inp { overflow: hidden; white-space: nowrap; padding: 3px 2px 2px; font-size: 21px; min-height: 30px; }
.inp .inpi { display: inline-block; padding-right: 14px; }
.inp.ro { opacity: .92; }
.out { text-align: right; white-space: nowrap; overflow: hidden; font-size: 25px; padding: 0 2px 2px; }
.out .multi, .multi { display: flex; flex-direction: column; align-items: flex-end; font-size: .82em; gap: 1px; }
.lb { font-size: .78em; margin-right: .25em; opacity: .9; }
.bool { font-weight: 600; letter-spacing: .06em; }
.calc.hist .inp, .calc.hist .out { background: rgba(var(--lcd-ink), .07); }
.hint { font-size: 11.5px; line-height: 1.3; opacity: .8; padding: 2px 2px 0; white-space: normal; }
.hint.big { font-size: 14px; padding-top: 30px; text-align: center; }

/* ---------- menus ---------- */
.menu { height: 100%; position: relative; display: flex; flex-direction: column; }
.mt, .gt { font: 600 12.5px/1.25 var(--font-lcd); padding: 1px 3px 2px; border-bottom: 1px solid rgba(var(--lcd-ink), .5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; }
.ml { flex: 1; display: grid; grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); padding-top: 2px; padding-right: 6px; min-height: 0; }
.mi { display: flex; align-items: center; gap: 7px; padding: 0 6px; font-size: 16.5px; white-space: nowrap; overflow: hidden; border-radius: 3px; min-height: 0; }
.mi.sel { background: rgba(var(--lcd-ink), .88); color: var(--lcd-bg); }
.mi.dis { opacity: .45; }
.mi small { font-size: 11px; opacity: .85; }
.ml1 { overflow: hidden; text-overflow: ellipsis; }
.mr { margin-left: auto; font-size: 13px; opacity: .85; padding-left: 8px; }
.ma { margin-left: 4px; opacity: .7; }
.mr + .ma { margin-left: 4px; }
.rd { width: 10px; height: 10px; border: 1.6px solid currentColor; border-radius: 50%; flex: 0 0 auto; box-sizing: border-box; position: relative; }
.rd.on::after { content: ''; position: absolute; inset: 1.5px; border-radius: 50%; background: currentColor; }
.sbar { position: absolute; right: 0; top: 20px; bottom: 3px; width: 3px; border-radius: 2px; background: rgba(var(--lcd-ink), .15); }
.sbar i { position: absolute; left: 0; right: 0; border-radius: 2px; background: rgba(var(--lcd-ink), .8); }
.vn { font-weight: 600; min-width: 1.2em; display: inline-block; }

/* ---------- home ---------- */
.home { height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 2px 7px 1px 0; box-sizing: border-box; }
.hi { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 6px; min-height: 0; padding: 2px; }
.hi.sel { background: rgba(var(--lcd-ink), .88); color: var(--lcd-bg); }
.hic { line-height: 0; }
.aic { width: 42px; height: 30px; font-family: var(--font-lcd); }
.hl { font-size: 12.5px; white-space: nowrap; letter-spacing: -.01em; }

/* ---------- error / confirm / info ---------- */
.err, .cfm { height: 100%; display: flex; align-items: center; justify-content: center; }
.eb { border: 1.5px solid currentColor; border-radius: 6px; padding: 8px 14px; text-align: center; background: rgba(255,255,255,.12); min-width: 62%; }
.et { font-size: 19px; font-weight: 600; }
.ee { font-size: 11px; opacity: .8; margin-bottom: 4px; }
.ex { font-size: 11.5px; line-height: 1.3; margin: 0 0 6px; max-width: 30em; text-wrap: pretty; }
.eb { max-width: 92%; box-sizing: border-box; }
.eh, .cb { display: flex; gap: 14px; justify-content: center; font-size: 12px; }
.eh b, .cb b { border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; font-size: 10.5px; }
.cfm { flex-direction: column; gap: 10px; text-align: center; }
.ct { font-size: 17px; padding: 0 6px; }
.ctr { font-size: 18px; letter-spacing: 2px; }
.info { height: 100%; display: flex; flex-direction: column; }
.ib { flex: 1; overflow: hidden; font-size: 14px; padding: 2px 3px; }
.help p { margin: 2px 0 6px; font-size: 12.5px; }
.hrow { display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px dotted rgba(var(--lcd-ink), .35); padding: 1px 0; }
.hk { opacity: .8; }

/* ---------- prompts, forms, grids ---------- */
.prompt, .fdef { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.lab { font-size: 17px; }
.pcur { text-align: right; font-size: 22px; }
.ged { height: 100%; display: flex; flex-direction: column; }
.gw { flex: 1; overflow: hidden; min-height: 0; }
table.grid { border-collapse: collapse; font-size: 14px; }
table.grid td { padding: 1px 5px; text-align: right; white-space: nowrap; }
table.grid.ed { width: 100%; table-layout: fixed; }
table.grid.ed td { border: 1px solid rgba(var(--lcd-ink), .35); height: 21px; overflow: hidden; text-overflow: clip; }
table.grid td.cellsel { background: rgba(var(--lcd-ink), .85); color: var(--lcd-bg); }
table.grid th { font-weight: 600; font-size: 12px; padding: 0 4px; border: 1px solid rgba(var(--lcd-ink), .35); background: rgba(var(--lcd-ink), .1); }
.gbot { border-top: 1px solid rgba(var(--lcd-ink), .45); min-height: 30px; font-size: 19px; text-align: right; white-space: nowrap; overflow: hidden; padding-top: 1px; }
.gbot .inp { text-align: left; font-size: 19px; padding-top: 1px; }
.gbot.ro { opacity: .95; }
.gbot.named { display: flex; align-items: center; gap: 6px; }
.gbot.named .gn { flex: 0 0 auto; font-size: 16px; margin-right: auto; padding-left: 2px; }
.gbot.named .inp { flex: 1; min-width: 0; }
.gbot .vd { font-size: 13px; font-weight: 600; margin-left: 8px; padding: 0 5px; border-radius: 3px; }
.gbot .vd.ok { background: rgba(var(--lcd-ink), .85); color: var(--lcd-bg); }
.gbot .vd.no { border: 1px solid currentColor; }
.matw { display: inline-flex; align-items: stretch; vertical-align: middle; font-size: .72em; }
.matw .br { width: 5px; border: 1.5px solid currentColor; }
.matw .br.l { border-right: 0; }
.matw .br.r { border-left: 0; }
table.grid.mat td { padding: 1px 6px; text-align: center; }
.flist { display: flex; flex-direction: column; gap: 1px; }
.fr { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 5px; border-radius: 3px; min-height: 25px; font-size: 17px; }
.fr.sel { background: rgba(var(--lcd-ink), .14); outline: 1.5px solid rgba(var(--lcd-ink), .8); }
.fr .fl { white-space: nowrap; }
.fr .fv { text-align: right; overflow: hidden; white-space: nowrap; max-width: 70%; }
.fr .fv .inp { padding: 0; min-height: 0; font-size: 17px; }
.ratio, .dist { height: 100%; display: flex; flex-direction: column; gap: 2px; }
.out.big { font-size: 26px; margin-top: auto; }
.list { font-size: 17px; }
.lrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 5px; min-height: 25px; border-radius: 3px; white-space: nowrap; }
.lrow.sel { background: rgba(var(--lcd-ink), .88); color: var(--lcd-bg); }
.lrow .lv { overflow: hidden; text-align: right; }

/* periodic table */
.ptab { height: 100%; display: grid; grid-template-columns: 1fr auto; grid-template-rows: 1fr auto; gap: 2px 8px; }
.pgrid { display: grid; grid-template-columns: repeat(18, 1fr); grid-template-rows: repeat(7, 1fr) 4px repeat(2, 1fr); gap: 1.5px; align-self: center; }
.pgrid i { display: block; aspect-ratio: 1; background: rgba(var(--lcd-ink), .25); border-radius: 1px; }
.pgrid i.f { background: rgba(var(--lcd-ink), .17); }
.pgrid i.on { background: rgba(var(--lcd-ink), .95); outline: 1.5px solid rgba(var(--lcd-ink), 1); }
.pinfo { text-align: center; min-width: 74px; align-self: center; }
.psym { font-size: 30px; font-weight: 600; line-height: 1.05; }
.pz, .pw { font-size: 13px; }
.pn { font-size: 11px; }
.ptab .hint { grid-column: 1 / -1; padding-top: 0; }

/* ---------- keyboard ---------- */
.kb { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 10px; }
.kt, .kf, .kn { display: grid; min-height: 0; }
.kt { flex: 3.15; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(3, 1fr); column-gap: 7px; row-gap: 2px; position: relative; }
.kf { flex: 2.15; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(2, 1fr); column-gap: 7px; row-gap: 3px; }
.kn { flex: 4.6; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr); column-gap: 9px; row-gap: 4px; }
.kc { display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; min-width: 0; position: relative; }
.sl { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 13px; font: 600 10.5px/13px var(--font-key); text-align: center; white-space: nowrap; letter-spacing: .01em; overflow: visible; }
.sl.two { justify-content: space-between; padding: 0 2px; }
.sl b { font-weight: 600; transition: opacity .08s, filter .08s; }
.sl b.s { color: var(--sh); }
.sl b.a { color: var(--al); font-weight: 700; }
.sl sup { font-size: .7em; line-height: 0; }
.sl.nm { color: var(--lab); font-size: 8.5px; letter-spacing: .08em; font-weight: 600; }
.kt .sl b { font-size: 9px; letter-spacing: .04em; }
.kt .kd + .sl, .kt .sl b.s { opacity: .95; }
.dev.shift .sl b.s, .dev.alpha .sl b.a { filter: brightness(1.18); }
.dev.shift .sl b.a, .dev.alpha .sl b.s { opacity: .35; }
.dev.basen .sl b.a.hx { color: #ffe08a; }
.k {
  flex: 1; min-height: 0; width: 100%; border: 0; margin: 0; padding: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center; position: relative;
  font: 600 17px/1 var(--font-key); border-radius: 12px; -webkit-tap-highlight-color: transparent;
  box-shadow: 0 2px 0 rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.08);
  transition: transform .05s, box-shadow .05s, filter .05s;
}
.k::before { content: ''; position: absolute; inset: -12px -3px -3px; }
.k:focus { outline: none; }
.k:focus-visible { outline: 2px solid var(--sh); outline-offset: 2px; }
.k.dn { transform: translateY(1.5px); box-shadow: 0 .5px 0 rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.25); filter: brightness(.93); }
.k .ic { width: 20px; height: 20px; }
.k .ic.sm { width: 17px; height: 17px; }
.ks { background: linear-gradient(180deg, var(--ks-bg), var(--ks-bg2)); color: var(--ks-fg); border-radius: 999px; box-shadow: 0 2px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12); }
.kt .kc { padding: 0 8%; }
.kt .kc .k { max-height: 40px; }
.kshift { background: var(--kshift-bg); color: var(--kshift-fg); border-radius: 999px; box-shadow: 0 2px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35); }
.dev.shift .kshift { box-shadow: 0 0 0 2px var(--body2), 0 0 0 4px var(--sh); }
.kalpha { background: var(--kalpha-bg); color: var(--kalpha-fg); border-radius: 999px; box-shadow: 0 2px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3); }
.dev.alpha .kalpha { box-shadow: 0 0 0 2px var(--body2), 0 0 0 4px var(--al); }
.kt-alpha, .kt-calc, .kt-on { font: 700 11.5px/1 var(--font-key); letter-spacing: .07em; }
.dpad { align-self: stretch; justify-self: stretch; margin: 2px -2px 0; border-radius: 48%; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.07), transparent 70%), var(--pad); box-shadow: inset 0 1px 3px rgba(0,0,0,.45), 0 1px 0 var(--rim); }
.kd { background: var(--kd-bg); color: var(--kd-fg); border-radius: 999px; box-shadow: 0 1.5px 0 rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14); }
.kt .kc:has(.kd) { padding: 0 2px; }
.kd.ok { font: 700 13px/1 var(--font-key); letter-spacing: .04em; }
.pg .pgk { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 4px 18% 6px; min-height: 0; }
.pg .pgk .k { border-radius: 999px 999px 6px 6px; max-height: none; }
.pg .pgk .k + .k { border-radius: 6px 6px 999px 999px; }
.fx { font: italic 600 15px/1 Georgia, 'Times New Roman', serif; letter-spacing: -.02em; }
.fx i { font-style: italic; }
.kfn { background: var(--kfn-bg); color: var(--kfn-fg); font-size: 16px; }
.kfn i { font: italic 600 19px/1 Georgia, 'Times New Roman', serif; }
.kfn sup, .kfn sub { font-size: .62em; }
.kfn .bx { display: inline-block; width: .55em; height: .62em; border: 1.4px solid currentColor; border-radius: 1.5px; vertical-align: -.05em; margin: 0 .05em; }
.kfn .bx.s, .kfn sup.bx, .kfn sub.bx { width: .42em; height: .46em; border-width: 1.2px; }
.kfn sup.bx { vertical-align: .7em; }
.kfn sub.bx { vertical-align: -.25em; }
.k .fi { display: inline-flex; flex-direction: column; gap: 3px; position: relative; }
.k .fi b { display: block; width: .52em; height: .46em; border: 1.4px solid currentColor; border-radius: 1.5px; }
.k .fi::after { content: ''; position: absolute; left: -3px; right: -3px; top: 50%; border-top: 1.6px solid currentColor; transform: translateY(-50%); }
.sl .kmx { display: inline-flex; align-items: center; gap: 2px; }
.sl .fi { display: inline-flex; flex-direction: column; gap: 1px; vertical-align: middle; position: relative; }
.sl .fi b { display: block; width: .42em; height: .32em; border: 1px solid currentColor; }
.kfn sup { vertical-align: .55em; }
.knum { background: var(--knum-bg); color: var(--knum-fg); font-size: 22px; font-weight: 600; border-radius: 14px; }
.kop { background: var(--kop-bg); color: var(--kop-fg); font-size: 21px; border-radius: 14px; }
.kop sup { font-size: .55em; }
.kred { background: var(--kred-bg); color: var(--kred-fg); font-size: 18px; border-radius: 14px; }
.kexe { background: var(--kexe-bg); color: var(--kexe-fg); font-size: 16px; letter-spacing: .06em; border-radius: 14px; }
.fmt { font: 700 9.5px/1 var(--font-key); letter-spacing: .08em; }
.k .ic { pointer-events: none; }
.k * { pointer-events: none; }

/* phones in landscape: display left, keyboard right */
.dev.wide { display: grid; grid-template-columns: minmax(0, 43%) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); column-gap: 14px; padding: 8px 12px 10px; border-radius: 22px; }
.dev.wide .brand { grid-column: 1; grid-row: 1; }
.dev.wide .bezel { grid-column: 1; grid-row: 2; height: auto; min-height: 0; }
.dev.wide .kb { grid-column: 2; grid-row: 1 / span 2; padding-top: 2px; gap: 3px; }
.dev.wide .sl { height: 10px; line-height: 10px; font-size: 8.5px; }
.dev.wide .kt .sl b { font-size: 8px; }
.dev.wide .k::before { inset: -10px -3px -2px; }
/* small screens */
@media (max-width: 380px) {
  .dev { padding: 10px 10px 12px; border-radius: 22px; }
  .kt, .kf { column-gap: 5px; }
  .kn { column-gap: 7px; }
  .knum { font-size: 20px; }
  .sl { font-size: 9.5px; }
}
@media (max-height: 640px) {
  .brand { padding-bottom: 4px; }
  .bezel { height: clamp(130px, 27%, 200px); }
  .sl { height: 11px; line-height: 11px; font-size: 9px; }
  .kb { padding-top: 6px; gap: 4px; }
}
.sbx { overflow: hidden; position: relative; min-height: 0; flex: 1; }
.rl .lrow { min-height: 27px; }
.ll { white-space: nowrap; font-size: .92em; }
.lv { flex: 1; text-align: right; overflow: hidden; }
table.grid.dg th { position: sticky; top: 0; z-index: 1; background: var(--lcd-bg); }
/* data grids look like a calculator list, not a spreadsheet: header rule, faint column rules */
table.grid.dg td { border: 0; border-left: 1px solid rgba(var(--lcd-ink), .28); border-bottom: 1px solid rgba(var(--lcd-ink), .1); }
table.grid.dg th { border: 0; border-bottom: 1.5px solid rgba(var(--lcd-ink), .6); }
table.grid.dg tr:first-child th { border-left: 1px solid rgba(var(--lcd-ink), .28); }
table.grid.dg tr:first-child th:first-child { border-left: 0; }
table.grid.dg th.rn, table.grid.dg td:first-child { border-left: 0; }
table.grid.dg tr:not(:first-child) th.rn { border-bottom: 0; opacity: .75; }
table.grid.dg td.cellsel { border-radius: 2px; }
table.grid.tbl td { border-bottom: 0; height: 22px; }
table.grid.dg th.rn { width: 22px; font-weight: 500; font-size: 10.5px; }
table.grid.dg tr th.rn { position: static; }
table.grid.dg tr:first-child th.rn { position: sticky; }
/* function definition lines (table, number line) */
.tfn { height: 100%; display: flex; flex-direction: column; gap: 3px; }
.fdl { display: flex; align-items: center; gap: 6px; padding: 1px 4px; border-radius: 3px; border: 1px solid transparent; min-height: 30px; }
.fdl.sel { border-color: rgba(var(--lcd-ink), .7); background: rgba(var(--lcd-ink), .06); }
.fdl .lab { font-size: 16px; white-space: nowrap; }
.fdl .inp { flex: 1; min-width: 0; font-size: 19px; padding: 1px 0; min-height: 0; }
.tfn .hint { margin-top: auto; }
/* inequality results */
.ineq { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 4px; }
.irow { text-align: center; font-size: 21px; white-space: nowrap; overflow: hidden; }
.out.sm { font-size: 15px; opacity: .85; }
.gbot.lft { text-align: left; }
.gbot.sm { font-size: 12.5px; text-align: left; padding-top: 4px; }
.gbot .lb { font-size: 12px; margin-right: 6px; }
/* spreadsheet */
table.grid.sh { table-layout: fixed; width: auto; }
table.grid.sh td { width: 66px; min-width: 66px; max-width: 66px; font-size: 13px; }
table.grid.sh td.fml { font-style: italic; }
table.grid td.fillsel { background: rgba(var(--lcd-ink), .25); }
/* math box */
.box { height: 100%; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 6px; align-items: center; font-size: 11.5px; border-bottom: 1px solid rgba(var(--lcd-ink), .5); padding-bottom: 2px; }
.tabs span { padding: 0 5px; border-radius: 3px; }
.tabs span.on { background: rgba(var(--lcd-ink), .88); color: var(--lcd-bg); }
.tabs em { margin-left: auto; font-style: normal; opacity: .7; font-size: 10px; }
.chartw { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.chart { width: 100%; height: 100%; overflow: visible; font-family: var(--font-lcd); }
.nlc { height: auto; max-height: 100%; }
.ucw { height: 100%; display: flex; gap: 8px; align-items: center; }

<script>

/* ===== num ===== */
/* num.js — exact & floating arithmetic for the calculator
 * Num: { v: float, ex: null | {s: terms} | {p: Q} }
 *   terms: sorted [{k: BigInt squarefree >= 1, c: Q}]  (value = Σ c·√k)
 *   p: Q (value = p·π)

(function (C) {

    constructor(code, pos) { super(code); this.code = code; this.pos = pos || null; }

  /* ---------- BigInt helpers ---------- */

    if (n < 9007199254740992n) {

  }

  /* ---------- Rationals ---------- */
  function Q(n, d) {

  const qadd = (a, b) => (a.d === b.d ? Q(a.n + b.n, a.d) : Q(a.n * b.d + b.n * a.d, a.d * b.d));
  const qsub = (a, b) => (a.d === b.d ? Q(a.n - b.n, a.d) : Q(a.n * b.d - b.n * a.d, a.d * b.d));

  const qdiv = (a, b) => { if (b.n === 0n) throw MATH(); return Q(a.n * b.d, a.d * b.n); };

  function qfromDec(str, exp) {
    let neg = false; if (str[0] === '-') { neg = true; str = str.slice(1); }
    let [ip, fp] = str.split('.'); ip = ip || '0'; fp = fp || '';

    if (!isFinite(v)) return null;

  }
  function digitsOf(b) { return babs(b).toString().length; }

  /* ---------- Num ---------- */
  class Num {
    constructor(v, ex) { this.v = v; this.ex = ex || null; }
  }
  const MAXTERMS = 4;
  function sNorm(terms) {
    const m = new Map();
    for (const t of terms) {
      const key = t.k.toString(); const prev = m.get(key);

  // float value of Σ c·√k. When the terms nearly cancel (e.g. −10¹⁰ + √(10²⁰−4)), plain floating point
  // loses every digit, so the sum is redone in BigInt fixed point with enough guard digits.
  function surdF(terms) {
    let s = 0, m = 0;
    for (const t of terms) { const x = qtoF(t.c) * (t.k === 1n ? 1 : Math.sqrt(Number(t.k))); s += x; m += Math.abs(x); }
    if (terms.length < 2 || !isFinite(m) || Math.abs(s) >= m * 1e-3) return s;
    return surdHP(terms, s);

  function surdHP(terms, fallback) {

    for (const t of terms) errUnits += babs(t.c.n) / t.c.d + 2n;
    for (let P = 40; P <= 640; P += 60) {

      for (const t of terms) acc += (t.c.n * (t.k === 1n ? S : isqrt(t.k * S * S))) / t.c.d;

    }

  }

  // results (fractions, surds, π multiples) are checked too: 15⁹⁰ used to show 7.05×10¹⁰⁵ and 10¹⁰⁰ 1×10¹⁰⁰.
  // Smaller than 10⁻⁹⁹ is 0.

    const v = qtoF(q);
    if (tooBig(v)) throw MATH();
    if (tooSmall(v)) return ZERO;
    if (qbig(q)) return new Num(v, null);

  function fromSurd(terms) {
    terms = sNorm(terms);
    const v = surdF(terms);
    if (tooBig(v)) throw MATH();
    if (tooSmall(v)) return ZERO;
    if (terms.length > MAXTERMS || terms.some((t) => qbig(t.c) || t.k > KLIM)) return new Num(v, null);
    return new Num(v, { s: terms });

    if (c.n === 0n) return fromQ(Q0);

    if (tooBig(v)) throw MATH();
    if (tooSmall(v)) return ZERO;
    if (qbig(c)) return new Num(v, null);
    return new Num(v, { p: c });

  function fromF(v) {

    if (tooBig(v)) throw MATH();

  const PI = fromPi(Q1);

  const isEx = (x) => !!x.ex;

    if (!x.ex || !x.ex.s) return null;
    const s = x.ex.s;
    if (s.length === 0) return Q0;
    if (s.length === 1 && s[0].k === 1n) return s[0].c;
    return null;

  function isZero(x) { if (x.ex) return x.ex.s ? x.ex.s.length === 0 : x.ex.p.n === 0n; return x.v === 0; }

        return fromSurd(out);

      if (b.ex.p && ra) return fromPi(qmul(b.ex.p, ra));

    const r = fromF(a.v * b.v);
    if (a.pq || b.pq) { const [p, x, xq, q] = a.pq ? [a.pq, a.rv, a.rq, ratOf(b)] : [b.pq, b.rv, b.rq, ratOf(a)]; if (q) return withPi(r, qmul(p, q), x * qtoF(q), xq && qmul(xq, q)); }
    return r;

  function div(a, b) {
    if (isZero(b)) throw MATH();

        if (a.ex.s && !a.ex.s.length) return ZERO;

    return r;

  function sqrtQ(r) { // r >= 0
    if (r.n === 0n) return ZERO;

  function sqrtQexact(r) { // rational sqrt or null

  /* ---------- periodic table ---------- */
  class PTable extends Screen {
    constructor(ui, scr, tgt) { super(ui); this.scr = scr; this.tgt = tgt; this.z = (ui.S.misc && ui.S.misc.ptz) || 1; }
    move(dr, dc) {
      const E = C.ELEMENTS; const cur = E[this.z - 1];
      if (dc) { const nz = this.z + dc; if (nz >= 1 && nz <= 118) this.z = nz; return; }
      // vertical: nearest element in target row with same column
      let r = cur.r + dr;
      while (r >= 1 && r <= 10) {
        const cand = E.filter((e) => e.r === r);
        if (cand.length) { let best = cand[0]; for (const e of cand) if (Math.abs(e.c - cur.c) < Math.abs(best.c - cur.c)) best = e; this.z = best.z; return; }
        r += dr;
      }
    }
    key(k) {
      switch (k) {
        case 'LEFT': this.move(0, -1); break;
        case 'RIGHT': this.move(0, 1); break;
        case 'UP': this.move(-1, 0); break;
        case 'DOWN': this.move(1, 0); break;
        case 'OK': case 'EXE': {
          const z = this.z; this.ui.S.misc = Object.assign({}, this.ui.S.misc, { ptz: z });
          this.ui.pop(); this.tgt.insert(tok('AtWt')); for (const d of String(z)) this.tgt.insert(ch(d)); this.tgt.insert(ch(')'));
          if (this.scr.afterInsert) this.scr.afterInsert();
          return true;
        }
        case 'AC': case 'BACK': this.ui.pop(); return true;
        default: return true;
      }
      return true;
    }
    tap(el) { const c = el.closest('[data-z]'); if (!c) return false; const z = +c.getAttribute('data-z'); if (z === this.z) this.key('OK'); else this.z = z; return true; }
    render() {
      const E = C.ELEMENTS; const e = E[this.z - 1];
      let cells = '';
      for (const x of E) cells += '<i data-z="' + x.z + '" class="' + (x.z === this.z ? 'on' : '') + (x.r > 7 ? ' f' : '') + '" style="grid-row:' + (x.r > 7 ? x.r : x.r) + ';grid-column:' + x.c + '"></i>';
      return '<div class="ptab"><div class="pgrid">' + cells + '</div><div class="pinfo"><div class="psym">' + e.sym + '</div><div class="pz">Z = ' + e.z + '</div><div class="pn">' + e.name + '</div><div class="pw">' + (e.stable ? '' : '[') + e.w.replace('.', ui0(this.ui)) + (e.stable ? '' : ']') + '</div></div>' +
        '<div class="hint">OK: chèn AtWt(' + e.z + ')</div></div>';
    }

      { label: 'Nghiệm (x; y)', act: () => askValues(ui, 'Nghiệm của hệ', ['x', 'y'], ([x, y]) => verdict(ui, s.type === 'unique' && same(x, s.x[0]) && same(y, s.x[1]), '(x; y) = (' + C.rowText(C.fmtReal(x, ui.st)) + '; ' + C.rowText(C.fmtReal(y, ui.st)) + ')')) },
      { label: 'Vô số nghiệm', act: () => verdict(ui, s.type === 'inf', 'Vô số nghiệm') },
      { label: 'Vô nghiệm', act: () => verdict(ui, s.type === 'none', 'Vô nghiệm') },
    ]));
  }

  /* ---------- simultaneous equations ---------- */
  function simulEditor(ui, n) {
    const A = coefs(ui, 'sim' + n, n * (n + 1));
    const cols = [];
    for (let j = 0; j <= n; j++) cols.push({ title: LET[j], editable: true, get: (r) => A[r * (n + 1) + j] || ZERO, set: (r, v) => { A[r * (n + 1) + j] = v; } });
    const tmpl = VN.slice(0, n).map((v, j) => LET[j] + '<sub>n</sub>' + v).join('+') + '=' + LET[n] + '<sub>n</sub>';
    const g = new DataGrid(ui, 'Hệ ' + n + ' ẩn: ' + tmpl, cols, {
      rows: () => n, advance: 'right', cellName: (r, c) => LET[c] + SUBS[r],
      onExe: () => (n === 2 && verifyOn(ui) ? verifySimul(ui, A) : solveSimul(ui, n, A)),
      onBack: (scr, k) => { if (k === 'BACK') ui.pop(); },
    });
    g.status = () => ({ tag: n === 2 && verifyOn(ui) ? 'KIỂM TRA' : '' });
    g.tools = () => [
      { label: 'Giải hệ', act: () => { ui.pop(); solveSimul(ui, n, A); } },
      ...(n === 2 ? [verifyItem(ui)] : []),
      { label: 'Xóa hệ số', act: () => { ui.pop(); A.fill(null); } },
      { label: 'Chọn loại phương trình', act: () => { ui.goHome(); ui.openApp(C.APPS.findIndex((a) => a.id === 'eqn')); } },
    ];
    return g;
  }
  function solveSimul(ui, n, A) {
    const M = [], b = [];
    for (let i = 0; i < n; i++) { const row = []; for (let j = 0; j < n; j++) row.push(A[i * (n + 1) + j] || ZERO); M.push(row); b.push(A[i * (n + 1) + n] || ZERO); }
    const s = C.solveLinear(M, b);
    if (s.type === 'inf') { ui.push(new ResultList(ui, 'Kết quả', [{ label: '', html: '<b>Vô số nghiệm</b>' }])); return; }
    if (s.type === 'none') { ui.push(new ResultList(ui, 'Kết quả', [{ label: '', html: '<b>Vô nghiệm</b>' }])); return; }
    s.x.forEach((v, i) => { if (VN[i] !== 't') ui.S.vars[VN[i]] = v; });
    ui.S.ans = s.x[0];
    ui.push(new ResultList(ui, 'Nghiệm của hệ', s.x.map((v, i) => ({ label: VN[i] + ' =', value: v })), { note: 'AC: quay lại sửa hệ số' }));
  }

  /* ---------- polynomial ---------- */
  function polyEditor(ui, d) {
    const A = coefs(ui, 'poly' + d, d + 1);
    const cols = [];
    for (let j = 0; j <= d; j++) cols.push({ title: LET[j], editable: true, get: () => A[j] || ZERO, set: (r, v) => { A[j] = v; } });
    const g = new DataGrid(ui, polyTemplate(d), cols, { rows: () => 1, advance: 'right', noRowNum: true, cellName: (r, c) => LET[c], onExe: () => (d === 2 && verifyOn(ui) ? verifyQuad(ui, A) : solvePoly(ui, d, A)), onBack: (scr, k) => { if (k === 'BACK') ui.pop(); } });
    g.status = () => ({ tag: d === 2 && verifyOn(ui) ? 'KIỂM TRA' : '' });
    g.tools = () => [
      { label: 'Giải phương trình', act: () => { ui.pop(); solvePoly(ui, d, A); } },
      ...(d === 2 ? [verifyItem(ui)] : []),
      { label: 'Nghiệm phức', right: ui.st.eqCplx !== false ? 'Hiện' : 'Ẩn', act: () => { ui.st.eqCplx = ui.st.eqCplx === false; ui.pop(); } },
      { label: 'Xóa hệ số', act: () => { ui.pop(); A.fill(null); } },
      { label: 'Chọn loại phương trình', act: () => { ui.goHome(); ui.openApp(C.APPS.findIndex((a) => a.id === 'eqn')); } },
    ];
    return g;
  }
  function trimLeading(cs) { let i = 0; while (i < cs.length - 1 && C.isZero(cs[i])) i++; return cs.slice(i); }
  function solvePoly(ui, d, A) {
    let cs = A.map((v) => v || ZERO);
    if (C.isZero(cs[0])) throw C.err('MATH');
    cs = trimLeading(cs);
    const roots = C.polyRootsM(cs); // distinct roots with multiplicity
    const items = [];
    const showC = ui.st.eqCplx !== false;
    let k = 0, hidden = 0;
    const shown = roots.filter((o) => C.isZero(o.z.im) || showC);
    for (const { z, m } of roots) {
      if (!C.isZero(z.im) && !showC) { hidden += m; continue; }
      k++;
      const v = C.isZero(z.im) ? z.re : z;
      const tag = m === 2 ? ' <small>(kép)</small>' : m > 2 ? ' <small>(bội ' + m + ')</small>' : '';
      items.push({ label: (shown.length === 1 ? 'x' : 'x' + SUBS[k - 1]) + tag + ' =', value: v, mode: C.isCx(v) ? 'cplx' : 'real' });
    }
    if (hidden && !items.length) items.push({ label: '', html: 'Không có nghiệm thực' });
    else if (hidden) items.push({ label: '', html: '<small>(' + hidden + ' nghiệm phức đã ẩn)</small>' });
    for (const e of C.polyExtrema(cs)) {
      const nm = e.kind === 'min' ? 'cực tiểu' : 'cực đại';
      items.push({ label: 'x ' + nm + ' =', value: e.x }, { label: 'y ' + nm + ' =', value: e.y });
    }
    const first = roots[0]; if (first && C.isZero(first.z.im)) ui.S.ans = first.z.re;
    ui.push(new ResultList(ui, polyTemplate(cs.length - 1), items, { note: 'AC: quay lại sửa hệ số' }));
  }

  /* ---------- solver ---------- */
  // Is x a root of f? Every test is relative, so multiplying the equation by any constant
  // (10⁻¹², 1, 10¹²) gives the same answer.
  function isRoot(ok, x) {
    const fx = ok(x);
    if (!isFinite(fx)) return false;
    const d = 1e-3 * Math.max(1, Math.abs(x));
    const fl = ok(x - d), fr = ok(x + d);
    const around = Math.max(isFinite(fl) ? Math.abs(fl) : 0, isFinite(fr) ? Math.abs(fr) : 0);
    // values below 10⁻⁹⁹ become 0, so a 0 next to another 0 is underflow, not a root: far out on an asymptote
    // (1/(x−3) = 0 at x = −10⁹⁹) or where e^x = 0 crosses 10⁻⁹⁹ (x = −228). A real root has both neighbours
    // non-zero (or outside the domain, as for √x = 0)
    if (fx === 0) return fl !== 0 && fr !== 0 && (isFinite(fl) || isFinite(fr));
    if (!(around > Math.abs(fx))) return false; // |f| not smaller here than nearby: no root here (or a pole)
    const h = Math.max(8 * Number.EPSILON * Math.abs(x), 1e-300);
    const a = ok(x - h), b = ok(x + h);
    if (isFinite(a) && isFinite(b) && ((a <= 0) !== (fx <= 0) || (b <= 0) !== (fx <= 0))) return true; // sign change within a few ulps
    return Math.abs(fx) <= 1e-9 * around; // root of even multiplicity: f touches 0 without changing sign
  }
  // a root on the edge of the domain (√x = 0, √(x−2.5) = 0): f only touches 0 where it stops being defined,
  // so there is no sign change to find. Walk from the best point to the edge and accept a nice value there
  // only if f is exactly 0 at it.
  function edgeRoot(ok, x) {
    if (x === null) return null;
    const cands = [x];
    for (const dir of [-1, 1]) {
      let a = x, b = x + dir * 1e-3 * Math.max(1, Math.abs(x));
      if (isFinite(ok(b))) continue;
      for (let i = 0; i < 200; i++) { const m = a + (b - a) / 2; if (m === a || m === b) break; if (isFinite(ok(m))) a = m; else b = m; }
      cands.push(a);
    }
    for (const c of cands) for (const y of [c, 0, C.polish(fromF(c)).v]) if (isFinite(y) && ok(y) === 0 && isRoot(ok, y)) return y;
    return null;
  }
  function newtonSolve(f, x0) {
    let best = null, bestF = Infinity; // smallest |f| seen, for edgeRoot
    const ok = (x) => { try { const v = f(x); if (!isFinite(v)) return NaN; if (Math.abs(v) < bestF) { bestF = Math.abs(v); best = x; } return v; } catch (e) { return NaN; } };
    const scale = (t) => Math.max(1, Math.abs(t));
    const deadline = Date.now() + 4000;
    let x = x0, fx = ok(x);
    if (fx === 0) return x;
    if (isFinite(fx)) {
      for (let i = 0; i < 400; i++) {
        const h = 1e-7 * scale(x);
        const d = (ok(x + h) - ok(x - h)) / (2 * h);
        if (!isFinite(d) || d === 0) break;
        let xn = x - fx / d, fn = ok(xn), t = 0;
        while ((!isFinite(fn) || Math.abs(fn) > Math.abs(fx)) && t < 30) { xn = (x + xn) / 2; fn = ok(xn); t++; }
        if (!isFinite(fn)) break;
        const done = xn === x || Math.abs(xn - x) <= 1e-15 * Math.max(Math.abs(xn), 1e-300);
        x = xn; fx = fn;
        if (fx === 0 || done) break;
      }
      if (isRoot(ok, x)) return x;
    }
    // bracket search outward from x0, then bisection down to the last representable number
    const bisect = (lo, hi, flo) => {
      for (let it = 0; it < 2200; it++) {
        const m = lo + (hi - lo) / 2, fm = ok(m);
        if (!isFinite(fm)) return null;
        if (fm === 0 || m <= lo || m >= hi) return m;
        if ((fm < 0) === (flo < 0)) { lo = m; flo = fm; } else hi = m;
      }
      return lo + (hi - lo) / 2;
    };
    for (const span of [1, 10, 100, 1e3, 1e4, 1e5, 1e6]) {
      const W = span * scale(x0), N = 120;
      for (const dir of [1, -1]) {
        let a = x0, fa = ok(a);
        for (let k = 1; k <= N; k++) {
          if (Date.now() > deadline) throw C.err('CANT');
          const b = x0 + dir * W * k / N, fb = ok(b);
          if (fb === 0 && isRoot(ok, b)) return b; // also when the next point is outside the domain (√x = 0 hits x = 0)
          if (isFinite(fa) && isFinite(fb) && (fa === 0 || fa * fb < 0)) {
            const r = fa === 0 ? a : bisect(Math.min(a, b), Math.max(a, b), dir > 0 ? fa : fb);
            if (r !== null && isRoot(ok, r)) return r;
          } else if (isFinite(fa) !== isFinite(fb)) {
            // one end is a pole or outside the domain (1.2/x = 8.1 from x = −4: the root 0.148 sits next to the
            // pole at 0): step from the defined end toward the other and bisect the first sign change
            const [p, fp, q] = isFinite(fa) ? [a, fa, b] : [b, fb, a];
            let prev = p, fprev = fp;
            for (let j = 1; j <= 50; j++) {
              const m = p + (q - p) * (1 - Math.pow(2, -j)), fm = ok(m);
              if (!isFinite(fm)) break;
              if (fm === 0) { if (isRoot(ok, m)) return m; break; }
              if ((fm < 0) !== (fprev < 0)) { const r = bisect(Math.min(prev, m), Math.max(prev, m), prev < m ? fprev : fm); if (r !== null && isRoot(ok, r)) return r; break; }
              prev = m; fprev = fm;
            }
          }
          a = b; fa = fb;
        }
      }
    }
    const er = edgeRoot(ok, best);
    if (er !== null) return er;
    throw C.err('CANT');
  }
  // solve L = R (or expression = 0) for variable v starting from its stored value; returns {x, lr}
  function solveAst(ui, ast, v) {
    const ctx = ui.ctx('real', { floatOnly: true, bind: {} });
    const L = ast.k === 'rel' ? ast.a : ast, R = ast.k === 'rel' ? ast.b : null;
    const sides = (t) => { ctx.bind[v] = fromF(t); const l = C.realOf(C.evalNode(L, ctx)).v; const r = R ? C.realOf(C.evalNode(R, ctx)).v : 0; return [l, r]; };
    const f = (t) => { const [l, r] = sides(t); return l - r; };
    const ok = (t) => { try { const y = f(t); return isFinite(y) ? y : NaN; } catch (e) { return NaN; } };
    const x0 = C.realOf(ui.S.vars[v] || ZERO).v;
    let x = newtonSolve(f, x0);
    // float dust around a root that is exactly 0: use 0 only when it is at least as good a root
    if (x !== 0 && Math.abs(x) <= 1e-9) { const f0 = ok(0); if (isFinite(f0) && Math.abs(f0) <= Math.abs(ok(x))) x = 0; }
    // a root of even multiplicity ((x−6)² = 0, x²+9.2x+21.16 = 0) is only found to about √ε (5.9999999234),
    // and near it L − R is already 0 in floating point. The shortest rounding of x at which L − R is exactly 0
    // — in exact arithmetic, since the typed coefficients are exact decimals — is the root
    const ectx = ui.ctx('real', { bind: {} });
    const exactZero = (s) => {
      try {
        const [m, e] = s.split('e');
        ectx.bind[v] = C.fromQ(C.qfromDec(m, e ? +e : 0));
        return C.isZero(C.sub(C.realOf(C.evalNode(L, ectx)), R ? C.realOf(C.evalNode(R, ectx)) : ZERO));
      } catch (err) { return false; }
    };
    for (let k = 6; k <= 13; k++) { const s = x.toPrecision(k), c = +s; if (c !== x && (ok(c) === 0 || exactZero(s))) { x = c; break; } }
    // exact form (√2, 1/3, π/4 …) only when it is at least as good a root as the float
    let xv = fromF(x);
    const nice = C.polish(xv);
    if (nice !== xv && nice.ex) { const fn = ok(nice.v); if (isFinite(fn) && Math.abs(fn) <= Math.abs(ok(x))) xv = nice; }
    // L − R is evaluated at the value that is actually returned; below the rounding noise of x itself
    // (≈ ε·|x·f′(x)|) it is reported as 0, as on the calculator
    let lr, l, r;
    try { [l, r] = sides(xv.v); lr = l - r; } catch (e) { throw C.err('CANT'); }
    const h = 1e-7 * Math.max(1, Math.abs(xv.v));
    const d1 = (ok(xv.v + h) - ok(xv.v - h)) / (2 * h);
    const noise = 4 * Number.EPSILON * ((isFinite(d1) ? Math.abs(d1 * xv.v) : 0) + Math.abs(l) + Math.abs(r));
    if (Math.abs(lr) <= noise) lr = 0;
    return { x: xv, lr: fromF(lr) };
  }
  class SolverScreen extends Screen {
    constructor(ui) {
      super(ui); this.le = new LineEdit({ mode: 'real' }); this.state = 'edit'; this.res = null;
      const E = store(ui); if (E.solverRow) this.le.ed.setRow(E.solverRow);
    }
    target() { if (this.state !== 'edit') { this.state = 'edit'; } return this.le.ed; }
    unknown(row) {
      const used = C.varsUsed(row); const pref = store(this.ui).solveVar;
      if (pref && used.indexOf(pref) >= 0) return pref;
      if (used.indexOf('x') >= 0) return 'x';
      return used[0] || null;
    }
    key(k) {
      if (this.state === 'res') {
        if (k === 'EXE' || k === 'OK') { this.start(); return true; }
        if (k === 'S_FORMAT' || k === 'S_EXE') { this.exact = !this.exact; return true; }
        if (k === 'AC' || k === 'LEFT' || k === 'RIGHT' || k === 'DEL') { this.state = 'edit'; return true; }
        if (C.EDIT_KEYS.has(k)) { this.state = 'edit'; return this.le.key(k); }
        return k !== 'BACK';
      }
      switch (k) {
        case 'EXE': case 'OK': this.start(); return true;
        case 'AC': this.le.ed.clear(); return true;
        case 'BACK': return false;
        default: return this.le.key(k);
      }
    }
    start() {
      const row = C.cloneRow(this.le.ed.root);
      if (!row.length) return;
      store(this.ui).solverRow = row;
      let ast;
      try { ast = C.parseRow(this.le.ed.root); } catch (e) { if (e instanceof C.CalcError) { this.ui.push(new ErrScreen(this.ui, e.code)); return; } throw e; }
      if (ast.k === 'rel' && ast.op !== '=') { this.ui.push(new ErrScreen(this.ui, 'SYNTAX')); return; }
      const v = this.unknown(row);
      if (!v) { this.ui.push(new ErrScreen(this.ui, 'VAR')); return; }
      const others = C.varsUsed(row).filter((x) => x !== v);
      const ask = (i) => {
        if (i < others.length) { this.ui.push(new C.VarPrompt(this.ui, others[i], 'real', () => ask(i + 1), () => {})); return; }
        this.ui.push(new C.VarPrompt(this.ui, v, 'real', () => this.solve(ast, v), () => {}));
        this.ui.top().title = 'Giá trị ban đầu';
      };
      ask(0);
    }
    solve(ast, v) {
      const ui = this.ui;
      try {
        const r = solveAst(ui, ast, v);
        ui.S.vars[v] = r.x; ui.S.ans = r.x;
        this.res = { v, x: r.x, lr: r.lr };
        this.state = 'res';
      } catch (e) { if (e instanceof C.CalcError) ui.push(new ErrScreen(ui, e.code)); else throw e; }
    }
    tools() {
      const ui = this.ui;
      return [{ label: 'Ẩn cần giải', right: store(ui).solveVar || 'x', act: () => ui.push(new Menu(ui, 'Giải theo ẩn', C.VARS.map((n) => ({ label: n, checked: (store(ui).solveVar || 'x') === n, act: () => { store(ui).solveVar = n; ui.popTo(this); } })))) },
        { label: 'Chọn loại phương trình', act: () => { ui.goHome(); ui.openApp(C.APPS.findIndex((a) => a.id === 'eqn')); } }];
    }
    render() {
      const mode = C.lineMode(this.ui);
      let h = '<div class="calc">';
      if (this.state === 'edit') {
        h += '<div class="gt">Giải phương trình (Solver)</div>' + this.le.html(mode);
        h += '<div class="hint">Nhập phương trình (SHIFT x là dấu =), rồi <b>EXE</b>. Mặc định giải theo ẩn <i>' + (store(this.ui).solveVar || 'x') + '</i>.</div>';
      } else {
        h += '<div class="inp ro"><div class="inpi">' + renderRow(this.le.ed.root, { mode }) + '</div></div>';
        h += '<div class="out fit"><span class="lb">' + this.res.v + '=</span>' + renderOut(fmtReal(this.res.x, this.ui.st, this.exact ? 'std' : 'dec')) + '</div>';
        h += '<div class="out sm"><span class="lb">L−R=</span>' + renderOut(fmtReal(this.res.lr, this.ui.st, 'dec')) + '</div>';
      }
      return h + '</div>';
    }
  }

  function eqnMenu(ui) {
    return new Menu(ui, 'Phương trình', [
      { label: 'Hệ phương trình bậc nhất', sub: () => [2, 3, 4].map((n) => ({ label: n + ' ẩn', act: () => { ui.pop(); ui.push(simulEditor(ui, n)); } })), subTitle: 'Số ẩn' },
      { label: 'Phương trình đa thức', sub: () => [2, 3, 4].map((d) => ({ label: polyTemplate(d).replace(/\+/g, '+'), act: () => { ui.pop(); ui.push(polyEditor(ui, d)); } })), subTitle: 'Bậc' },
      { label: 'Giải phương trình (Solver)', act: () => ui.push(new SolverScreen(ui)) },
    ]);
  }
  C.startEqn = (ui) => eqnMenu(ui);

  /* ---------- inequalities ---------- */
  const REL = [['>', '>'], ['<', '<'], ['>=', '≥'], ['<=', '≤']];
  function ineqEditor(ui, d, rel) {
    const A = coefs(ui, 'ineq' + d, d + 1);
    const cols = [];
    for (let j = 0; j <= d; j++) cols.push({ title: LET[j], editable: true, get: () => A[j] || ZERO, set: (r, v) => { A[j] = v; } });
    const relS = REL.find((r) => r[0] === rel)[1];
    const g = new DataGrid(ui, polyTemplate(d, relS), cols, { rows: () => 1, advance: 'right', noRowNum: true, cellName: (r, c) => LET[c], onExe: () => solveIneq(ui, d, A, rel), onBack: (scr, k) => { if (k === 'BACK') ui.pop(); } });
    g.tools = () => [{ label: 'Giải bất phương trình', act: () => { ui.pop(); solveIneq(ui, d, A, rel); } }, { label: 'Xóa hệ số', act: () => { ui.pop(); A.fill(null); } }];
    return g;
  }
  function ineqSolve(cs, rel) {
    // distinct real roots with multiplicity (exact for rational coefficients)
    const rs = C.polyRootsM(cs).filter((o) => C.isZero(o.z.im)).map((o) => ({ x: o.z.re, m: o.m })).sort((a, b) => a.x.v - b.x.v);
    const uniq = [];
    for (const r of rs) {
      const last = uniq[uniq.length - 1];
      if (last && Math.abs(r.x.v - last.x.v) <= 1e-12 * Math.max(1, Math.abs(r.x.v))) last.m += r.m; else uniq.push({ x: r.x, m: r.m });
    }
    const sat = (s) => (rel === '>' ? s > 0 : rel === '<' ? s < 0 : rel === '>=' ? s >= 0 : s <= 0);
    const n = uniq.length;
    // sign on each open interval: right of all roots = sign of the leading coefficient;
    // crossing a root of odd multiplicity flips it, even multiplicity keeps it (no float sign tests)
    const sg = new Array(n + 1); sg[n] = Math.sign(cs[0].v);
    for (let i = n - 1; i >= 0; i--) sg[i] = uniq[i].m % 2 ? -sg[i + 1] : sg[i + 1];
    const atoms = [];
    for (let i = 0; i <= n; i++) {
      atoms.push({ kind: 'I', i, ok: sat(sg[i]) });
      if (i < n) atoms.push({ kind: 'R', i, ok: sat(0) });
    }
    const segs = []; let cur = null;
    for (const a of atoms) {
      if (a.ok) { if (!cur) cur = { start: a, end: a }; else cur.end = a; }
      else if (cur) { segs.push(cur); cur = null; }
    }
    if (cur) segs.push(cur);
    return { segs, roots: uniq.map((u) => u.x), mult: uniq.map((u) => u.m), n };
  }
  function solveIneq(ui, d, A, rel) {
    let cs = A.map((v) => v || ZERO);

        case '<=': return { lo: null, hi: v, hiIn: true };
        case '>': return { lo: v, loIn: false, hi: null };
        case '>=': return { lo: v, loIn: true, hi: null };
        case '=': return { lo: v, loIn: true, hi: v, hiIn: true };
        default: throw C.err('SYNTAX');
      }
    };
    if (ast.k !== 'rel') throw C.err('SYNTAX');
    if (ast.a.k === 'rel') { // c1 op1 x op2 c2
      const inner = ast.a;
      // both signs must point the same way (−1 < x < 2); 1 < x > 3 is not an interval
      const up = (o) => o === '<' || o === '<=', down = (o) => o === '>' || o === '>=';
      if (!isX(inner.b) || !((up(inner.op) && up(ast.op)) || (down(inner.op) && down(ast.op)))) throw C.err('SYNTAX');
      const A = one(inner.op, inner.a, false), B = one(ast.op, ast.b, true);
      const r = { lo: A.lo || B.lo, loIn: A.lo ? A.loIn : B.loIn, hi: B.hi || A.hi, hiIn: B.hi ? B.hiIn : A.hiIn };
      const c = C.cmp(r.lo, r.hi); // 3 < x < 1 has no solution; it used to be drawn as 1 < x < 3
      return c > 0 || (c === 0 && !(r.loIn && r.hiIn)) ? { empty: true, lo: null, hi: null } : r;
    }
    if (isX(ast.a)) return one(ast.op, ast.b, true);
    if (isX(ast.b)) return one(ast.op, ast.a, false);
    throw C.err('SYNTAX');
  }
  class NumberLine extends Screen {
    constructor(ui) {
      super(ui); this.sel = 0; this.show = false;
      const saved = store(ui).nl || [];
      this.les = [0, 1, 2].map((i) => { const le = new LineEdit({ mode: 'real' }); if (saved[i]) le.ed.setRow(saved[i]); return le; });
    }
    target() { this.show = false; return this.les[this.sel].ed; }
    key(k) {
      const le = this.les[this.sel];
      if (this.show) { if (k === 'AC' || k === 'BACK' || k === 'EXE' || k === 'OK' || C.EDIT_KEYS.has(k) || k === 'UP' || k === 'DOWN') { this.show = false; if (C.EDIT_KEYS.has(k)) return le.key(k); return true; } return true; }
      switch (k) {
        case 'UP': if (!le.ed.vert('up')) this.sel = (this.sel + 2) % 3; return true;
        case 'DOWN': if (!le.ed.vert('down')) this.sel = (this.sel + 1) % 3; return true;
        case 'EXE': case 'OK': this.draw(); return true;
        case 'AC': le.ed.clear(); return true;
        case 'BACK': this.ui.pop(); return true;
        default: return le.key(k);
      }
    }
    draw() {
      store(this.ui).nl = this.les.map((le) => C.cloneRow(le.ed.root));
      const ctx = this.ui.ctx('real');
      this.ints = [];
      for (const le of this.les) {
        if (le.ed.isEmpty()) { this.ints.push(null); continue; }
        try { this.ints.push(intervalOf(C.parseRow(le.ed.root), ctx)); }
        catch (e) { if (e instanceof C.CalcError) { this.ui.push(new ErrScreen(this.ui, e.code)); return; } throw e; }
      }
      if (this.ints.every((x) => !x)) return;
      this.show = true;
    }
    tap(el) { const r = el.closest('[data-i]'); if (!r) return false; this.sel = +r.getAttribute('data-i'); this.show = false; return true; }
    render() {
      if (this.show) return this.renderLine();
      const mode = C.lineMode(this.ui);
      let h = '<div class="tfn nl">';
      this.les.forEach((le, i) => {
        h += '<div class="fdl' + (i === this.sel ? ' sel' : '') + '" data-i="' + i + '"><span class="lab">' + (i + 1) + ':</span>' + le.html(mode, i === this.sel ? undefined : false, () => { this.sel = i; this.show = false; }) + '</div>';
      });
      return h + '<div class="hint">Nhập tối đa 3 bất đẳng thức theo <i>x</i> (vd: x≤3, −1&lt;x&lt;2; dấu trong CATALOG ▸ Khác). <b>EXE</b> để vẽ.</div></div>';
    }
    renderLine() {
      const pts = [];
      for (const it of this.ints) if (it) { if (it.lo) pts.push(it.lo.v); if (it.hi) pts.push(it.hi.v); }
      let lo = Math.min(...pts), hi = Math.max(...pts);
      if (!isFinite(lo)) { lo = -5; hi = 5; }
      if (hi - lo < 1e-9) { lo -= 3; hi += 3; }
      const pad = (hi - lo) * 0.35 || 1; lo -= pad; hi += pad;
      const W = 320, H = 122, X = (v) => 12 + (v - lo) / (hi - lo) * (W - 24);
      const ay = H - 26;
      let svg = '<svg class="chart nlc" viewBox="0 0 ' + W + ' ' + H + '"><path d="M4 ' + ay + 'H' + (W - 4) + 'M' + (W - 10) + ' ' + (ay - 4) + 'L' + (W - 4) + ' ' + ay + 'L' + (W - 10) + ' ' + (ay + 4) + '" fill="none" stroke="currentColor" stroke-width="1.4"/>';
      // ticks at endpoints
      const seen = new Set();
      this.ints.forEach((it) => { if (!it) return; for (const e of [it.lo, it.hi]) if (e && !seen.has(e.v)) { seen.add(e.v); const x = X(e.v); svg += '<path d="M' + x + ' ' + (ay - 4) + 'V' + (ay + 4) + '" stroke="currentColor"/><text x="' + x + '" y="' + (ay + 17) + '" font-size="11" text-anchor="middle" fill="currentColor">' + C.esc(C.cellText(e, this.ui.st, 7)) + '</text>'; } });
      this.ints.forEach((it, i) => {
        if (!it) return;
        const y = 18 + i * 22;
        const x1 = it.lo ? X(it.lo.v) : 6, x2 = it.hi ? X(it.hi.v) : W - 6;
        svg += '<text x="2" y="' + (y + 4) + '" font-size="10" fill="currentColor">' + (i + 1) + '</text>';
        if (it.empty) { svg += '<text x="14" y="' + (y + 4) + '" font-size="11" fill="currentColor">Vô nghiệm</text>'; return; }
        svg += '<path d="M' + x1 + ' ' + y + 'H' + x2 + '" stroke="currentColor" stroke-width="3"/>';
        if (!it.lo) svg += '<path d="M' + (x1 + 6) + ' ' + (y - 5) + 'L' + x1 + ' ' + y + 'L' + (x1 + 6) + ' ' + (y + 5) + '" fill="none" stroke="currentColor" stroke-width="2"/>';
        if (!it.hi) svg += '<path d="M' + (x2 - 6) + ' ' + (y - 5) + 'L' + x2 + ' ' + y + 'L' + (x2 - 6) + ' ' + (y + 5) + '" fill="none" stroke="currentColor" stroke-width="2"/>';
        const dot = (x, filled) => '<circle cx="' + x + '" cy="' + y + '" r="4.2" fill="' + (filled ? 'currentColor' : 'var(--lcd-bg)') + '" stroke="currentColor" stroke-width="1.6"/>';
        if (it.lo) svg += dot(x1, it.loIn);
        if (it.hi && !(it.lo && it.hi.v === it.lo.v)) svg += dot(x2, it.hiIn);
        if (it.lo || it.hi) { const ref = it.lo || it.hi; svg += '<path d="M' + X(ref.v) + ' ' + (y + 6) + 'V' + (ay - 4) + '" stroke="currentColor" stroke-dasharray="2 3" opacity=".6"/>'; }
      });
      return '<div class="chartw">' + svg + '</svg></div>';
    }
  }

  /* ---------- unit circle ---------- */
  class UnitCircle extends Screen {
    constructor(ui) {
      super(ui); const B = store(ui);
      this.theta = B.theta ? C.desNum(B.theta) : C.fromDegExact(Q(30), ui.st.angle);
      this.unit = B.thetaU || ui.st.angle; // unit the stored angle is written in
      this.le = null;
    }
    target() { if (!this.le) this.le = new LineEdit({ mode: 'real' }); return this.le.ed; }
    keep() { const B = store(this.ui); B.theta = C.serNum(this.theta); B.thetaU = this.unit; }
    // after the angle unit changed in SETTINGS, 30° is shown as π/6 rad, not as 30 rad
    sync() { const u = this.ui.st.angle; if (this.unit !== u) { this.theta = C.convAngle(this.theta, this.unit, u); this.unit = u; this.keep(); } }
    step(dir) {
      this.sync();
      this.theta = C.add(this.theta, C.fromDegExact(Q(15 * dir), this.unit));
      this.keep();
    }
    key(k) {
      if (this.le) {
        if (k === 'EXE' || k === 'OK') {
          try { if (!this.le.ed.isEmpty()) { this.sync(); this.theta = C.realOf(C.evaluateRow(this.le.ed.root, this.ui.ctx('real')).value); } this.keep(); }
          catch (e) { if (e instanceof C.CalcError) { this.ui.push(new ErrScreen(this.ui, e.code)); return true; } throw e; }
          this.le = null; return true;
        }
        if (k === 'AC') { this.le = null; return true; }
        return this.le.key(k);
      }
      switch (k) {
        case 'LEFT': this.step(-1); return true;
        case 'RIGHT': this.step(1); return true;
        case 'OK': this.le = new LineEdit({ mode: 'real' }); return true;
        case 'AC': case 'BACK': this.ui.pop(); return true;
        default:
          if (C.EDIT_KEYS.has(k)) { this.le = new LineEdit({ mode: 'real' }); return this.le.key(k); }
          return true;
      }
    }
    render() {
      const st = this.ui.st, u = st.angle;
      let th, s, c, t = null;
      try { this.sync(); th = this.theta; s = C.sin(th, u); c = C.cos(th, u); try { t = C.tan(th, u); } catch (e) { t = null; } }
      catch (e) { return '<div class="hint big">Góc quá lớn</div>'; }
      const R = 50, cx = 62, cy = 64, px = cx + R * c.v, py = cy - R * s.v;
      const ang = C.toRad(th.v, u);
      const a2 = ((ang % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const arcR = 14, ax = cx + arcR * Math.cos(a2), ay = cy - arcR * Math.sin(a2);
      let svg = '<svg class="uc" viewBox="0 0 124 128">' +
        '<path d="M4 ' + cy + 'H120M' + cx + ' 4V124" stroke="currentColor" stroke-width=".8" opacity=".55"/>' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="currentColor" stroke-width="1.3"/>' +
        '<path d="M' + (cx + arcR) + ' ' + cy + 'A' + arcR + ' ' + arcR + ' 0 ' + (a2 > Math.PI ? 1 : 0) + ' 0 ' + ax + ' ' + ay + '" fill="none" stroke="currentColor" stroke-width="1"/>' +
        '<path d="M' + px + ' ' + py + 'V' + cy + 'M' + px + ' ' + py + 'H' + cx + '" stroke="currentColor" stroke-dasharray="2 2" stroke-width="1"/>' +
        '<path d="M' + cx + ' ' + cy + 'L' + px + ' ' + py + '" stroke="currentColor" stroke-width="2"/>' +
        '<circle cx="' + px + '" cy="' + py + '" r="3" fill="currentColor"/></svg>';
      const v = (x) => renderOut(fmtReal(x, st));
      let h = '<div class="ucw">' + svg + '<div class="ucv">';
      h += '<div class="ucr"><span class="lb">θ=</span>' + (this.le ? this.le.html(C.lineMode(this.ui)) : v(th)) + '</div>';
      h += '<div class="ucr"><span class="lb">sin θ=</span>' + v(s) + '</div>';
      h += '<div class="ucr"><span class="lb">cos θ=</span>' + v(c) + '</div>';
      h += '<div class="ucr"><span class="lb">tan θ=</span>' + (t ? v(t) : '<small>không xác định</small>') + '</div>';
      h += '<div class="hint">◀ ▶ đổi góc · OK nhập góc</div></div></div>';
      return h;
    }
  }

  function boxMenu(ui) {
    return new Menu(ui, 'Hộp toán học', [
      { label: 'Gieo xúc xắc', act: () => ui.push(trialForm(ui, 'dice')) },
      { label: 'Tung đồng xu', act: () => ui.push(trialForm(ui, 'coin')) },
      { label: 'Trục số', act: () => ui.push(new NumberLine(ui)) },
